<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALAJI • Daily Project Updates</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#142235}
.wrap{max-width:1100px;margin:auto;padding:20px}
.box{background:#fff;border:1px solid #e4e9f0;border-radius:18px;padding:20px;margin-bottom:18px}
h1,h2{margin-top:0}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px}
textarea{min-height:100px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:#f58220;color:#fff}
.secondary{background:#eef2f7;color:#142235}
.status{padding:12px;border-radius:10px;margin-top:12px}
.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.card{border:1px solid #e4e9f0;border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.small{font-size:12px;color:#64748b}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <div>
        <h1>📈 Daily Project Update</h1>
        <div class="small">यह page केवल project की daily progress update जोड़ने के लिए है।</div>
      </div>
      <button class="btn secondary" onclick="location.href='dashboard.html'">⬅ Dashboard</button>
    </div>
  </div>

  <div class="box">
    <h2>➕ नई Daily Update जोड़ें</h2>
    <form id="updateForm">
      <div class="grid">
        <div>
          <label>Project *</label>
          <select id="projectSelect" required>
            <option value="">Project चुनें</option>
          </select>
        </div>
        <div>
          <label>Update Date *</label>
          <input id="updateDate" type="date" required>
        </div>
        <div>
          <label>Title *</label>
          <input id="title" required placeholder="जैसे: Roof slab completed">
        </div>
        <div>
          <label>Progress %</label>
          <input id="progress" type="number" min="0" max="100" value="0">
        </div>
        <div class="full">
          <label>Details</label>
          <textarea id="details" placeholder="आज किया गया काम लिखें"></textarea>
        </div>
        <div class="full">
          <label>Photo URL (optional)</label>
          <input id="photo" placeholder="https://...">
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" type="submit">💾 Save Daily Update</button>
        <button class="btn secondary" type="reset">Reset</button>
      </div>
      <div id="msg"></div>
    </form>
  </div>

  <div class="box">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <div>
        <h2>📋 Recent Updates</h2>
        <div class="small">चुने गए project की latest updates</div>
      </div>
      <button class="btn secondary" onclick="loadRecent()">↻ Refresh</button>
    </div>
    <div id="recent"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://iefxfyjmyssuiuyncfqz.supabase.co';
const SUPABASE_KEY='sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showMsg(text,type='ok'){
  document.getElementById('msg').innerHTML=`<div class="status ${type}">${text}</div>`;
}

async function loadProjects(){
  const {data,error}=await sb.from('projects').select('id,project_name').order('project_name');
  if(error){showMsg(error.message,'err');return}
  const sel=document.getElementById('projectSelect');
  sel.innerHTML='<option value="">Project चुनें</option>';
  (data||[]).forEach(p=>{
    const o=document.createElement('option');
    o.value=p.id;
    o.textContent=p.project_name||('Project #'+p.id);
    sel.appendChild(o);
  });
}

async function loadRecent(){
  const projectId=document.getElementById('projectSelect').value;
  const box=document.getElementById('recent');
  box.innerHTML='<div class="small">Loading...</div>';

  let query=sb.from('project_updates').select('update_date,title,details,progress_percent,photo_url,project_id,created_at').order('update_date',{ascending:false}).order('created_at',{ascending:false}).limit(10);
  if(projectId) query=query.eq('project_id',projectId);

  const {data,error}=await query;
  if(error){box.innerHTML=`<div class="status err">${error.message}</div>`;return}
  if(!data?.length){box.innerHTML='<div class="small">कोई update उपलब्ध नहीं है।</div>';return}

  box.innerHTML=data.map(u=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <div style="font-weight:800">${u.title||'Update'}</div>
          <div class="small">📅 ${u.update_date||''}</div>
        </div>
        <div style="font-weight:800;color:#f58220">${Number(u.progress_percent||0)}%</div>
      </div>
      <div style="margin-top:10px;line-height:1.6">${(u.details||'कोई विवरण नहीं').replace(/</g,'&lt;')}</div>
      ${u.photo_url?`<img src="${u.photo_url}" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:12px;border:1px solid #e4e9f0">`:''}
    </div>
  `).join('');
}

document.getElementById('projectSelect').addEventListener('change',loadRecent);

document.getElementById('updateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const payload={
    project_id:document.getElementById('projectSelect').value,
    update_date:document.getElementById('updateDate').value,
    title:document.getElementById('title').value.trim(),
    details:document.getElementById('details').value.trim(),
    progress_percent:Number(document.getElementById('progress').value||0),
    photo_url:document.getElementById('photo').value.trim()||null
  };

  if(!payload.project_id||!payload.update_date||!payload.title){
    showMsg('Project, Date और Title जरूरी हैं।','err');
    return;
  }

  const {error}=await sb.from('project_updates').insert(payload);
  if(error){showMsg('❌ '+error.message,'err');return}

  showMsg('✅ Daily project update save हो गई।');
  document.getElementById('details').value='';
  document.getElementById('photo').value='';
  await loadRecent();
});

document.getElementById('updateDate').value=new Date().toISOString().slice(0,10);
loadProjects();
loadRecent();
</script>
</body>
</html>
