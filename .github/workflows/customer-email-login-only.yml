name: Customer email login only

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only customer login
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('customer-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old="""<div class=\"login-tabs\"><button id=\"phoneTab\" class=\"login-tab active\" type=\"button\" onclick=\"setLoginMode('phone')\">📱 Mobile Number</button><button id=\"emailTab\" class=\"login-tab\" type=\"button\" onclick=\"setLoginMode('email')\">📧 Email</button></div><div id=\"phoneLogin\"><label>📱 Mobile Number</label><input id=\"phone\" type=\"tel\" inputmode=\"numeric\" maxlength=\"10\" placeholder=\"10 digit mobile number\"></div><div id=\"emailLogin\" class=\"hidden\"><label>📧 Email Address</label><input id=\"loginEmail\" type=\"email\" autocomplete=\"username\" placeholder=\"customer@example.com\"></div>"""
          new="""<div id=\"emailLogin\"><label>📧 Email Address</label><input id=\"loginEmail\" type=\"email\" autocomplete=\"username\" placeholder=\"customer@example.com\" required></div>"""
          if old not in s: raise SystemExit('Customer login UI block not found')
          s=s.replace(old,new,1)
          s=s.replace('<div class=\"notice\">Login के लिए Mobile Number या Email और Password इस्तेमाल कर सकते हैं।</div>','<div class=\"notice\">Login के लिए Email और Password इस्तेमाल करें।</div>',1)
          s=s.replace("let user=null,customer=null,projects=[],loginMode='phone';","let user=null,customer=null,projects=[],loginMode='email';",1)
          old_login="""async function login(){q('msg').textContent='';const password=q('password').value;if(password.length<6){q('msg').textContent='Password कम से कम 6 अक्षर का रखें';return}let email,phone='';if(loginMode==='phone'){phone=normalizePhone(q('phone').value);if(phone.length!==10){q('msg').textContent='कृपया सही 10 digit mobile number डालें';return}email=authEmail(phone)}else{email=q('loginEmail').value.trim().toLowerCase();if(!email.includes('@')){q('msg').textContent='कृपया सही Email डालें';return}}const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){q('msg').textContent='Login details गलत हैं।';return}await start(data.user,phone)}"""
          new_login="""async function login(){q('msg').textContent='';const email=q('loginEmail').value.trim().toLowerCase(),password=q('password').value;if(!email.includes('@')){q('msg').textContent='कृपया सही Email डालें';return}if(password.length<6){q('msg').textContent='Password कम से कम 6 अक्षर का रखें';return}const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){q('msg').textContent='Login details गलत हैं।';return}await start(data.user,'')}"""
          if old_login not in s: raise SystemExit('Customer login function not found')
          s=s.replace(old_login,new_login,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Balajicontruction'
          git config user.email 'satpalnehra30@gmail.com'
          git add customer-dashboard.html
          git commit -m 'Use email and password for customer login only'
          git push
