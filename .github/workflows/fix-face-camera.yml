name: Fix worker face camera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch camera startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker-face.js')
          s=p.read_text(encoding='utf-8')
          marker="async function safeFaceCamera(){"
          helper="""async function safeFaceCamera(){\n  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('इस browser/page में camera access उपलब्ध नहीं है। HTTPS और camera permission check करें।');\n  const attempts=[\n    {video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}},audio:false},\n    {video:{width:{ideal:640},height:{ideal:480}},audio:false},\n    {video:true,audio:false}\n  ];\n  let last=null;\n  for(const constraints of attempts){\n    try{return await navigator.mediaDevices.getUserMedia(constraints)}catch(e){last=e; if(e && e.name==='NotAllowedError') throw e;}\n  }\n  throw last || new Error('Could not start video source');\n}\n"""
          if marker not in s:
              anchor="async function loadModels(){"
              if anchor not in s: raise SystemExit('loadModels anchor missing')
              s=s.replace(anchor, helper+anchor, 1)
          s=s.replace("navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false})", "safeFaceCamera()")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Normalize customer Projects and Actions columns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker-avatar.js')
          s=p.read_text(encoding='utf-8')
          marker='/* BALAJI — Customer Records only: exactly one Projects column + one Actions column. */'
          if marker not in s:
              s += r'''\n\n/* BALAJI — Customer Records only: exactly one Projects column + one Actions column. */
(()=>{
  'use strict';
  function normalize(){
    const tb=document.getElementById('customersTable');
    const table=tb?.closest('table');
    if(!tb||!table)return;
    const head=table.querySelector('thead tr');
    if(head){
      const projectHeads=[...head.children].filter(x=>x.textContent.trim().toLowerCase()==='projects');
      projectHeads.slice(1).forEach(x=>x.remove());
      const actionHeads=[...head.children].filter(x=>x.textContent.trim().toLowerCase()==='actions');
      if(actionHeads.length){
        actionHeads.slice(1).forEach(x=>x.remove());
        head.appendChild(actionHeads[0]);
      }
    }
    tb.querySelectorAll('tr').forEach(row=>{
      const action=[...row.children].find(td=>td.querySelector('[onclick*="editCustomer"],[onclick*="deleteCustomer"]'));
      if(!action)return;
      const markedProjects=[...row.children].filter(td=>td.hasAttribute('data-customer-projects-cell')||td.hasAttribute('data-project-cell'));
      let project=markedProjects.find(td=>td.hasAttribute('data-customer-projects-cell'))||markedProjects.find(td=>td.hasAttribute('data-project-cell'));
      if(!project){
        const heads=[...table.querySelectorAll('thead tr th')];
        const pi=heads.findIndex(th=>th.textContent.trim().toLowerCase()==='projects');
        if(pi>=0)project=row.children[pi];
      }
      markedProjects.filter(td=>td!==project).forEach(td=>td.remove());
      if(project&&project!==action)row.insertBefore(project,action);
      if(action!==row.lastElementChild)row.appendChild(action);
    });
  }
  normalize();
  setTimeout(normalize,300);
  setTimeout(normalize,1000);
  setInterval(normalize,2500);
})();
'''
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No fixes needed'
            exit 0
          fi
          git config user.name 'Balajicontruction'
          git config user.email 'satpalnehra30@gmail.com'
          git add worker-face.js worker-avatar.js
          git commit -m 'Normalize customer Projects and Actions columns'
          git push
