name: Fix worker payment binding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix worker payment binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker payment list
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker-face.js')
          s=p.read_text()
          old="window.__lastWorkers=Array.isArray(window.workers)?window.workers:[];"
          new="window.__lastWorkers=(typeof workers!=='undefined'&&Array.isArray(workers))?workers:[];"
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-face.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix worker payment binding'
          git push
