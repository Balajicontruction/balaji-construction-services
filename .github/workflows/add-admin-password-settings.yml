name: Add admin password settings
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html'); s=p.read_text(encoding='utf-8')
          nav='''    <button data-page="updates">\n      📅 Daily Update\n    </button>'''
          if 'data-page="admin-settings"' not in s:
              s=s.replace(nav,nav+'''\n\n    <button data-page="admin-settings">\n      ⚙️ Admin Settings\n    </button>''',1)
          marker='''<!-- ================= PROJECTS ================= -->'''
          section='''<!-- ================= ADMIN SETTINGS ================= -->\n<section id="page-admin-settings" class="page">\n  <div class="sectionHead"><div><h2>⚙️ Admin Settings</h2><p>Admin account password बदलें</p></div></div>\n  <div class="card" style="max-width:620px">\n    <h3 style="margin-top:0">🔐 Change Password</h3>\n    <p class="muted">पुराना password डालने की जरूरत नहीं है।</p>\n    <div class="formGrid">\n      <div class="field full"><label for="adminNewPassword">नया Password</label><input id="adminNewPassword" type="password" minlength="6" autocomplete="new-password" placeholder="नया password"></div>\n      <div class="field full"><label for="adminConfirmPassword">नया Password दोबारा</label><input id="adminConfirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="नया password दोबारा डालें"></div>\n    </div>\n    <div class="modalActions"><button class="btn btn-primary" onclick="changeAdminPassword()">🔐 Change Password</button></div>\n    <div id="adminPasswordMessage" style="margin-top:14px"></div>\n  </div>\n</section>\n\n\n'''
          if 'id="page-admin-settings"' not in s: s=s.replace(marker,section+marker,1)
          title='''    updates:'📅 Daily Update'\n\n  };'''
          if "'admin-settings':'⚙️ Admin Settings'" not in s: s=s.replace(title,"""    updates:'📅 Daily Update',\n    'admin-settings':'⚙️ Admin Settings'\n\n  };""",1)
          jsmarker='''/* =========================================================\n   LOAD ALL DATA\n========================================================= */'''
          js='''/* =========================================================\n   ADMIN PASSWORD SETTINGS\n========================================================= */\nasync function changeAdminPassword(){\n  const np=document.getElementById('adminNewPassword')?.value||'';\n  const cp=document.getElementById('adminConfirmPassword')?.value||'';\n  const msg=document.getElementById('adminPasswordMessage');\n  if(!np||!cp){msg.innerHTML='<div class="status cancelled">❌ दोनों password भरें।</div>';return;}\n  if(np.length<6){msg.innerHTML='<div class="status cancelled">❌ Password कम से कम 6 characters का रखें।</div>';return;}\n  if(np!==cp){msg.innerHTML='<div class="status cancelled">❌ दोनों password एक जैसे नहीं हैं।</div>';return;}\n  try{const {data,error}=await sb.auth.updateUser({password:np});if(error)throw error;if(!data?.user)throw new Error('Password update नहीं हुआ।');document.getElementById('adminNewPassword').value='';document.getElementById('adminConfirmPassword').value='';msg.innerHTML='<div class="status completed">✅ Admin password सफलतापूर्वक बदल गया।</div>';}catch(error){console.error('admin password update:',error);msg.innerHTML='<div class="status cancelled">❌ '+(error?.message||'Password बदलने में समस्या हुई।')+'</div>';}}\n\n\n'''
          if 'async function changeAdminPassword()' not in s: s=s.replace(jsmarker,js+jsmarker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Balajicontruction'
          git config user.email 'satpalnehra30@gmail.com'
          git add dashboard.html
          git commit -m 'Add admin password change settings'
          git push
          git rm .github/workflows/add-admin-password-settings.yml
          git commit -m 'Remove temporary admin password settings workflow'
          git push
