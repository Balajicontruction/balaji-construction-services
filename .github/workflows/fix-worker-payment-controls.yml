name: Fix worker payment controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix worker payment controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone payment controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker-payments.js')
          s=p.read_text(encoding='utf-8')
          marker='/* STANDALONE WORKER PAYMENT CONTROLS v3 */'
          if marker not in s:
              addon=r'''\n\n/* STANDALONE WORKER PAYMENT CONTROLS v3 */\n(()=>{\n  'use strict';\n  const esc3=v=>String(v??'').replace(/[&<>\\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',"'":'&#39;'}[c]));\n  const num3=v=>{const n=Number(String(v??'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:0};\n  const money3=v=>'₹'+num3(v).toLocaleString('en-IN');\n  const today3=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};\n  const sb3=()=>window.sb || (typeof sb!=='undefined'?sb:null) || window.supabaseClient || null;\n  const worker3=id=>(Array.isArray(window.__workerAdminCache)?window.__workerAdminCache:[]).find(w=>String(w.id)===String(id))||null;\n  const payments3=()=>Array.isArray(window.__workerAdminPaymentCache)?window.__workerAdminPaymentCache:[];\n  const att3=w=>{const rows=(window.__workerAdminAttendanceCache||[]).filter(x=>String(x.worker_id||x.workerId)===String(w.id));let p=0;rows.forEach(x=>{const st=String(x.status||x.attendance||'').toLowerCase().trim();if(['present','p','yes','1','full day'].includes(st))p++;else if(['half','half day','0.5'].includes(st))p+=.5});return p};\n  const wage3=w=>num3(w.daily_rate??w.daily_wage??w.wage??w.daily_salary);\n  const earned3=w=>wage3(w)*att3(w);\n  const paid3=w=>payments3().filter(x=>String(x.worker_id)===String(w.id)).reduce((a,x)=>a+num3(x.amount),0);\n  const upi3=w=>String(w?.upi_id||'').trim();\n  const toast3=m=>typeof window.toast==='function'?window.toast(m):alert(m);\n  const close3=id=>document.getElementById(id)?.remove();\n  const ensure3=async()=>{const s=sb3();if(!s)throw new Error('Supabase उपलब्ध नहीं है');return s};\n  const refresh3=async()=>{const s=sb3();if(!s)return;const wr=await s.from('workers').select('*').order('created_at',{ascending:false});if(!wr.error){window.__workerAdminCache=wr.data||[]}const pr=await s.from('worker_payments').select('*').order('payment_date',{ascending:false}).order('created_at',{ascending:false});if(!pr.error){window.__workerAdminPaymentCache=pr.data||[]}if(typeof window.patchCards==='function')window.patchCards()};\n  const baseModal3=(id,title,body)=>{close3(id);const m=document.createElement('div');m.className='modal';m.id=id;m.innerHTML=`<div class=\"modalBox\"><div class=\"modalHead\"><h3>${title}</h3><button class=\"close\" type=\"button\">×</button></div>${body}</div>`;document.body.appendChild(m);m.classList.add('show');m.querySelector('.close').onclick=()=>m.remove();m.addEventListener('click',e=>{if(e.target===m)m.remove()});return m};\n  const showUpi3=async id=>{\n    const w=worker3(id);if(!w)return toast3('❌ Worker नहीं मिला');\n    const m=baseModal3('adminWorkerUpiModal','📲 '+(upi3(w)?'Edit':'Set')+' Worker UPI',`<p><strong>${esc3(w.name||w.worker_name||'Worker')}</strong></p><div class=\"field\"><label>UPI ID</label><input id=\"standaloneWorkerUpi\" type=\"text\" autocomplete=\"off\" placeholder=\"9876543210@upi\" value=\"${esc3(upi3(w))}\"><span class=\"uploadHint\">उदाहरण: 9876543210@upi, name@ybl, name@oksbi</span></div><div class=\"modalActions\"><button type=\"button\" class=\"btn btn-light\" id=\"standaloneUpiCancel\">Cancel</button><button type=\"button\" class=\"btn btn-green\" id=\"standaloneUpiSave\">💾 Save UPI</button></div>`);\n    m.querySelector('#standaloneUpiCancel').onclick=()=>m.remove();\n    m.querySelector('#standaloneUpiSave').onclick=async()=>{\n      const input=m.querySelector('#standaloneWorkerUpi'),clean=input.value.trim().replace(/\\s+/g,'');\n      if(!clean)return toast3('❌ UPI ID डालें');\n      if(!/^[A-Za-z0-9._-]{2,}@[A-Za-z0-9._-]{2,}$/.test(clean))return toast3('❌ सही UPI ID डालें, जैसे 9876543210@upi');\n      try{const s=await ensure3();const r=await s.from('workers').update({upi_id:clean}).eq('id',w.id);if(r.error)throw r.error;const check=await s.from('workers').select('id,upi_id').eq('id',w.id).maybeSingle();if(check.error)throw check.error;if(!check.data||String(check.data.upi_id||'').trim()!==clean)throw new Error('Database ने UPI ID update नहीं की');window.__workerAdminCache=(window.__workerAdminCache||[]).map(x=>String(x.id)===String(w.id)?{...x,upi_id:clean}:x);m.remove();toast3('✅ UPI ID save हो गई');await refresh3();}catch(e){console.error('standalone UPI save',e);toast3('❌ UPI save नहीं हुई: '+(e.message||e))}\n    };\n  };\n  const showPay3=async(id,paymentId='')=>{\n    const w=worker3(id);if(!w)return toast3('❌ Worker नहीं मिला');const all=payments3().filter(x=>String(x.worker_id)===String(w.id));const current=all.find(x=>String(x.id)===String(paymentId))||null;const earned=earned3(w),old=current?num3(current.amount):0,paid=paid3(w)-old,pending=Math.max(0,earned-paid);\n    const m=baseModal3('adminWorkerPaymentModal',current?'✏️ Edit Worker Payment':'💸 Worker Payment Update',`<strong>${esc3(w.name||w.worker_name||'Worker')}</strong><div class=\"workerPaymentSummary\"><div><span>Total Earnings</span><strong>${money3(earned)}</strong></div><div><span>Paid</span><strong class=\"green\">${money3(paid)}</strong></div><div><span>Pending</span><strong class=\"red\">${money3(pending)}</strong></div></div><form id=\"standalonePaymentForm\"><div class=\"formGrid\"><div class=\"field\"><label>Payment Amount (₹)</label><input id=\"spAmount\" type=\"number\" min=\"1\" step=\".01\" required value=\"${current?esc3(current.amount):(pending>0?esc3(pending):'')}\"></div><div class=\"field\"><label>Payment Date</label><input id=\"spDate\" type=\"date\" required value=\"${esc3(current?.payment_date||today3())}\"></div><div class=\"field\"><label>Payment Method</label><select id=\"spMethod\"><option>UPI</option><option>Cash</option><option>Bank</option></select></div><div class=\"field\"><label>UTR / Reference</label><input id=\"spRef\" value=\"${esc3(current?.reference_no||'')}\"></div><div class=\"field full\"><label>Receipt / Screenshot</label><input id=\"spReceipt\" type=\"file\" accept=\"image/*,.pdf\"><span class=\"uploadHint\">Receipt history में save होगी।</span></div><div class=\"field full\"><label>Notes</label><textarea id=\"spNotes\">${esc3(current?.notes||'')}</textarea></div></div><div class=\"modalActions\"><button type=\"button\" class=\"btn btn-light\" id=\"spCancel\">Cancel</button><button type=\"submit\" class=\"btn btn-green\">💾 ${current?'Update Payment':'Save Payment'}</button></div></form>`);\n    m.querySelector('#spMethod').value=current?.payment_method||'UPI';m.querySelector('#spCancel').onclick=()=>m.remove();m.querySelector('#standalonePaymentForm').onsubmit=async e=>{e.preventDefault();const amount=num3(m.querySelector('#spAmount').value);if(amount<=0)return toast3('❌ सही payment amount डालें');try{const s=await ensure3();const f=m.querySelector('#spReceipt').files[0];let receipt=current?.receipt_url||null;if(f){if(f.size>4*1024*1024)return toast3('❌ Receipt 4MB से छोटी रखें');receipt=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Receipt read failed'));r.readAsDataURL(f)})}const payload={worker_id:w.id,amount,payment_date:m.querySelector('#spDate').value||today3(),payment_method:m.querySelector('#spMethod').value,reference_no:m.querySelector('#spRef').value.trim()||null,notes:m.querySelector('#spNotes').value.trim()||null,receipt_url:receipt};const r=current?await s.from('worker_payments').update(payload).eq('id',current.id):await s.from('worker_payments').insert(payload);if(r.error)throw r.error;m.remove();toast3(current?'✅ Payment updated':'✅ Payment save हो गई');await refresh3()}catch(e){console.error('standalone payment',e);toast3('❌ Payment save नहीं हुई: '+(e.message||e))}};\n  };\n  const wire3=()=>{window.adminSetWorkerUpi=id=>showUpi3(id);window.adminWorkerPayment=id=>showPay3(id);window.adminEditWorkerPayment=id=>{const p=payments3().find(x=>String(x.id)===String(id));if(p)showPay3(p.worker_id,p.id)};window.adminDeleteWorkerPayment=async id=>{if(!confirm('यह payment record delete करें?'))return;try{const s=await ensure3();const r=await s.from('worker_payments').delete().eq('id',id);if(r.error)throw r.error;toast3('✅ Payment delete हो गई');await refresh3()}catch(e){toast3('❌ Payment delete नहीं हुई: '+(e.message||e))}}};\n  wire3();setTimeout(wire3,300);setTimeout(wire3,1200);\n})();\n'''
              p.write_text(s+addon,encoding='utf-8')
          d=Path('dashboard.html')
          ds=d.read_text(encoding='utf-8')
          import re
          ds=re.sub(r'<script src="worker-payments\\.js(?:\\?[^\"]*)?"></script>', '<script src="worker-payments.js?v=20260815-payfix4"></script>', ds, count=1)
          d.write_text(ds,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-payments.js dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix worker payment controls'
          git push
