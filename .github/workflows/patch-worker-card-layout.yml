name: Patch worker card payment layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Worker card payment layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch payment button and worker photo mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('worker-payments.js')
          s = p.read_text(encoding='utf-8')

          # 1) Keep the existing worker Add/Save/Face/Attendance code untouched.
          # Only improve the payment add-on's read-only face-photo mapping.
          old = "try{const r=await s.from('worker_face_registrations').select('worker_id,photo_url');faceRows=r.error?[]:(r.data||[]);const fm={};faceRows.forEach(x=>{if(x.photo_url)fm[String(x.worker_id)]=x.photo_url});workersCache.forEach(w=>{w.face_photo_url=fm[String(w.id)]||w.face_photo_url||''})}catch(e){faceRows=[]}"
          new = "try{const r=await s.from('worker_face_registrations').select('*');faceRows=r.error?[]:(r.data||[]);const fm={};faceRows.forEach(x=>{const photo=x.photo_url||x.image_url||x.photo||x.face_image||x.face_image_url||x.snapshot_url||x.image_data||x.face_data||'';if(photo)fm[String(x.worker_id||x.workerId)]=photo});workersCache.forEach(w=>{w.face_photo_url=fm[String(w.id)]||w.face_photo_url||''})}catch(e){faceRows=[]}"
          if old not in s:
              raise SystemExit('face mapping marker not found')
          s = s.replace(old, new, 1)

          # 2) Add the PAYMENT button next to the worker name, matching the supplied design.
          pattern = r"function patchCards\(\)\{.*?\}\nfunction showPaymentModal"
          replacement = r'''function patchCards(){
           const box=document.getElementById('workersList');if(!box)return;
           [...box.querySelectorAll('.workerCard')].forEach((card,i)=>{
             const w=cardWorker(card,i);if(!w)return;
             const avatar=card.querySelector('.workerHead .avatar'),img=imageFor(w);
             if(avatar&&img){const safe=esc(img);avatar.outerHTML=`<img class="workerProfilePhoto" src="${safe}" alt="${esc(w.name||w.worker_name||'Worker')}" loading="lazy">`}
             card.querySelector('[data-worker-payment]')?.remove();
             const nameBlock=card.querySelector('.workerHead h3');
             if(nameBlock){nameBlock.parentElement.querySelector('.workerNamePaymentBtn')?.remove();nameBlock.insertAdjacentHTML('afterend',`<button type="button" class="workerNamePaymentBtn" onclick="adminWorkerPayment('${esc(w.id)}')">💰 PAYMENT</button>`)}
             const actions=card.querySelector('.actions');
             if(actions)actions.insertAdjacentHTML('beforebegin',panelHTML(w));
           })
          }
          function showPaymentModal'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('patchCards marker not found')
          s = s2

          # 3) Small CSS only for the new PAYMENT button beside the worker name.
          css_marker = ".workerPaymentBox{margin-top:16px;"
          css = ".workerNamePaymentBtn{display:inline-flex;align-items:center;justify-content:center;margin-top:7px;padding:7px 14px;border:0;border-radius:10px;background:#ff7f1f;color:#fff;font-weight:900;font-size:12px;cursor:pointer;box-shadow:0 2px 7px rgba(255,127,31,.22)}.workerNamePaymentBtn:hover{filter:brightness(.96)}\n"
          if css not in s:
              if css_marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(css_marker, css + css_marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-payments.js
          git diff --cached --quiet && exit 0
          git commit -m 'Worker card payment layout'
          git push

      - name: Remove one-time patch workflow
        if: success()
        run: |
          git rm .github/workflows/patch-worker-card-layout.yml
          git commit -m 'Remove one-time worker card patch workflow'
          git push
