name: Payment approval workflow patch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch only Admin Payment section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          # Payment-only styling.
          s = s.replace('.status.cancelled{', '.status.rejected,\n.status.cancelled{', 1)

          render = r'''function renderPayments(){
            let received=0, pending=0, rejected=0;
            payments.forEach(p=>{
              const amount=num(p.amount);
              const st=String(p.status||'pending').toLowerCase();
              if(st==='received') received+=amount;
              else if(st==='rejected') rejected+=amount;
              else pending+=amount;
            });

            document.getElementById('paymentReceived').textContent=money(received);
            document.getElementById('paymentPending').textContent=money(pending);

            const tbody=document.getElementById('paymentsTable');
            if(!payments.length){
              tbody.innerHTML='<tr><td colspan="6"><div class="empty">कोई payment record नहीं मिला।</div></td></tr>';
              return;
            }

            tbody.innerHTML=payments.map(p=>{
              const project=getProject(p.project_id);
              const customer=getCustomer(p.customer_id || project?.customer_id);
              const status=String(p.status||'pending').toLowerCase();
              const statusHtml=status==='received'
                ? '<span class="status received">✅ Received</span>'
                : status==='rejected'
                  ? '<span class="status rejected">❌ Rejected</span>'
                  : '<span class="status pending">⏳ Pending</span>';
              const actions = status==='pending'
                ? `<div class="actions">
                    <button class="btn btn-green btn-sm" onclick="approvePayment('${esc(p.id)}')">✅ Approve</button>
                    <button class="btn btn-red btn-sm" onclick="rejectPayment('${esc(p.id)}')">❌ Cancel</button>
                    <button class="btn btn-blue btn-sm" onclick="editPayment('${esc(p.id)}')">✏️ Edit</button>
                    <button class="btn btn-red btn-sm" onclick="deletePayment('${esc(p.id)}')">🗑️ Delete</button>
                  </div>`
                : `<div class="actions">
                    <button class="btn btn-blue btn-sm" onclick="editPayment('${esc(p.id)}')">✏️ Edit</button>
                    <button class="btn btn-red btn-sm" onclick="deletePayment('${esc(p.id)}')">🗑️ Delete</button>
                  </div>`;
              return `<tr>
                <td><strong>${esc(p.project_name||project?.project_name||'—')}</strong></td>
                <td>${esc(p.customer_name||customer?.name||customer?.customer_name||'—')}</td>
                <td><strong>${money(p.amount)}</strong></td>
                <td>${esc(p.payment_date||p.date||'—')}</td>
                <td>${statusHtml}</td>
                <td>${actions}</td>
              </tr>`;
            }).join('');
          }

          async function approvePayment(id){
            if(!confirm('इस payment को Approve करके Received करना है?')) return;
            const {error}=await sb.from('payments').update({status:'received'}).eq('id',id).eq('status','pending');
            if(error){toast('❌ Payment approve नहीं हुआ: '+error.message);return;}
            toast('✅ Payment approved — Received');
            await loadAll();
          }

          async function rejectPayment(id){
            if(!confirm('इस payment को Cancel करके Rejected करना है?')) return;
            const {error}=await sb.from('payments').update({status:'rejected'}).eq('id',id).eq('status','pending');
            if(error){toast('❌ Payment reject नहीं हुआ: '+error.message);return;}
            toast('❌ Payment rejected');
            await loadAll();
          }

          '''

          s, n = re.subn(r'function renderPayments\(\)\{.*?\n\n\}\n\n\nfunction openPaymentModal', render + 'function openPaymentModal', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate renderPayments block')

          modal_block = r'''function openPaymentModal(id=''){
            document.getElementById('paymentForm').reset();
            document.getElementById('paymentId').value='';
            populateSelects();
            document.getElementById('paymentDate').value=today();
            document.getElementById('paymentStatus').value='pending';

            if(id){
              const p=payments.find(x=>String(x.id)===String(id));
              if(!p) return;
              document.getElementById('paymentId').value=p.id;
              document.getElementById('paymentProject').value=p.project_id||'';
              const project=getProject(p.project_id);
              document.getElementById('paymentCustomer').value=p.customer_id||project?.customer_id||'';
              document.getElementById('paymentAmount').value=p.amount||'';
              document.getElementById('paymentDate').value=p.payment_date||p.date||today();
              document.getElementById('paymentStatus').value=p.status||'pending';
              document.getElementById('paymentNotes').value=p.notes||'';
            }
            openModal('paymentModal');
          }

          function editPayment(id){ openPaymentModal(id); }

          '''
          s, n = re.subn(r'function openPaymentModal\(id=\'\'\)\{.*?\n\nfunction editPayment\(id\)\{.*?\n\n\}\n\n', modal_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate payment modal block')

          submit_block = r'''document.getElementById('paymentForm').addEventListener('submit', async e=>{
            e.preventDefault();
            const id=document.getElementById('paymentId').value;
            const projectId=document.getElementById('paymentProject').value||null;
            const project=getProject(projectId);
            const customerId=document.getElementById('paymentCustomer').value||project?.customer_id||null;
            const payload={
              project_id:projectId,
              customer_id:customerId,
              amount:num(document.getElementById('paymentAmount').value),
              payment_date:document.getElementById('paymentDate').value||null,
              status:document.getElementById('paymentStatus').value||'pending',
              notes:document.getElementById('paymentNotes').value.trim()
            };
            let result;
            if(id) result=await sb.from('payments').update(payload).eq('id',id);
            else result=await sb.from('payments').insert(payload);
            if(result.error){toast('❌ Payment save नहीं हुआ: '+result.error.message);return;}
            closeModal('paymentModal');
            toast(id?'✅ Payment updated':'✅ Payment added as Pending');
            await loadAll();
          });

          '''
          s, n = re.subn(r'document\.getElementById\(\s*\'paymentForm\'\s*\)\.addEventListener\(.*?\n\nasync function deletePayment', submit_block + 'async function deletePayment', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate payment submit block')

          # Make the payment modal explicitly support all three states.
          old = '''<option value="received">Received</option>\n          <option value="pending">Pending</option>'''
          new = '''<option value="pending">Pending</option>\n          <option value="received">Received</option>\n          <option value="rejected">Rejected</option>'''
          if old not in s:
              raise SystemExit('Payment status options not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('Payment-only patch applied')
          PY

      - name: Commit payment-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git commit -m 'Add customer payment approval workflow to admin' || exit 0
          git push
