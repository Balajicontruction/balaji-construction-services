name: Fix worker attendance approval in admin dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python3 .github/patch_worker_attendance_dashboard.py
      - name: Commit dashboard patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if ! git diff --cached --quiet; then git commit -m 'Show pending worker attendance approval in worker cards' && git push; fi
