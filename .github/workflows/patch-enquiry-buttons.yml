name: Add enquiry action buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch dashboard only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')
          old = '''<td><button class="btn primary" onclick="updateEnquiry('${x.id}')">Save</button></td>'''
          new = '''<td><div class="enquiry-actions"><button class="btn approve-btn" onclick="setEnquiryStatus('${x.id}','approved')">🟢 Approve</button><button class="btn contact-btn" onclick="setEnquiryStatus('${x.id}','contacted')">🟡 Contacted</button><button class="btn reject-btn" onclick="setEnquiryStatus('${x.id}','rejected')">🔴 Reject</button><button class="btn note-btn" onclick="saveEnquiryNote('${x.id}')">📝 Save Note</button></div></td>'''
          if old not in s:
              raise SystemExit('target action cell not found')
          s = s.replace(old, new, 1)
          css_old = '.small{font-size:12px}.enquiry-card{border-left:4px solid var(--o)}'
          css_new = '.small{font-size:12px}.enquiry-card{border-left:4px solid var(--o)}.enquiry-actions{display:flex;gap:7px;flex-wrap:wrap;min-width:330px}.enquiry-actions .btn{padding:8px 10px;font-size:12px}.approve-btn{background:#dcfce7;color:#166534}.contact-btn{background:#fef3c7;color:#92400e}.reject-btn{background:#fee2e2;color:#991b1b}.note-btn{background:#eef2f7;color:#142235}'
          if css_old not in s:
              raise SystemExit('target css not found')
          s = s.replace(css_old, css_new, 1)
          fn_old = '''async function updateEnquiry(id){const status=q('status_'+id).value,note=q('note_'+id).value;'''
          fn_new = '''async function setEnquiryStatus(id,status){const note=q('note_'+id)?.value||'';const{error}=await sb.from('contract_requests').update({status,admin_notes:note}).eq('id',id);if(error)return toast(error.message);toast(status==='approved'?'Enquiry Approved':status==='contacted'?'Customer marked Contacted':'Enquiry Rejected');await loadEnquiries();await refreshAll()}
          async function saveEnquiryNote(id){const note=q('note_'+id)?.value||'';const{error}=await sb.from('contract_requests').update({admin_notes:note}).eq('id',id);if(error)return toast(error.message);toast('Admin Note saved');await loadEnquiries()}
          async function updateEnquiry(id){const status=q('status_'+id).value,note=q('note_'+id).value;'''
          if fn_old not in s:
              raise SystemExit('target function not found')
          s = s.replace(fn_old, fn_new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit dashboard change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-enquiry-buttons.yml
          git add dashboard.html .github/workflows/patch-enquiry-buttons.yml
          git commit -m "Add customer enquiry action buttons"
          git push