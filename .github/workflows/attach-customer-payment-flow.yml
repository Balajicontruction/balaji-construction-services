name: Attach customer payment flow
on:
  push:
    branches: [main]
    paths:
      - 'customer-payment-flow.js'
      - '.github/workflows/attach-customer-payment-flow.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach payment script and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer-dashboard.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="customer-payment-flow.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/attach-customer-payment-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-dashboard.html .github/workflows/attach-customer-payment-flow.yml
          git commit -m 'Connect customer UPI payment flow' || exit 0
          git push