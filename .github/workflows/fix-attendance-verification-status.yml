name: Fix worker attendance verification status
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python3 .github/patches/fix-attendance-verification-status.py
      - name: Commit dashboard fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix worker attendance approval status values'
            git push
          fi
