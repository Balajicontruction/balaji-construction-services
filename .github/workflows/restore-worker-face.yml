name: Restore worker face verification

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-face:
    if: github.event.head_commit.message != 'Fix enquiry patch workflow' && github.event.head_commit.message != 'Patch customer enquiry controls only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch customer enquiries only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          face_api = '<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>'
          face_js = '<script src="worker-face.js"></script>'
          if 'face-api.js@0.22.2/dist/face-api.min.js' not in s:
              s = s.replace('</body>', face_api + '\n</body>', 1)
          if 'src="worker-face.js"' not in s and "src='worker-face.js'" not in s:
              s = s.replace('</body>', face_js + '\n</body>', 1)

          marker = """/* =========================================================
   ENQUIRIES
========================================================= */"""
          start = s.find(marker)
          if start < 0:
              raise SystemExit('ENQUIRIES marker not found')
          delete_start = s.find('async function deleteEnquiry(id)', start)
          if delete_start < 0:
              raise SystemExit('deleteEnquiry function not found')

          new = """/* =========================================================
   ENQUIRIES
========================================================= */

function enquiryCustomer(e){
  const uid=String(e?.customer_user_id||'');
  const customer=(typeof customers!=='undefined'?customers:[]).find(c=>String(c.user_id||'')===uid)||{};
  const profile=(typeof profileMap!=='undefined'?profileMap[uid]:null)||{};
  return {customer,profile};
}

function enquiryStatus(value){
  const s=String(value||'pending').toLowerCase().trim();
  if(['approved','approve','accepted','accept'].includes(s)) return 'approved';
  if(['cancelled','canceled','cancel','rejected','reject'].includes(s)) return 'cancelled';
  return 'pending';
}

function enquiryStatusLabel(status){
  return status==='approved'?'Approved':status==='cancelled'?'Cancelled':'Pending';
}

function renderEnquiries(){
  const tbody=document.getElementById('enquiriesTable');
  if(!tbody)return;
  if(!enquiries.length){
    tbody.innerHTML='<tr><td colspan="5"><div class="empty">अभी कोई enquiry नहीं मिली।</div></td></tr>';
    return;
  }
  tbody.innerHTML=enquiries.map(e=>{
    const {customer,profile}=enquiryCustomer(e);
    const name=e.name||e.customer_name||e.full_name||profile.full_name||customer.name||'—';
    const phone=e.phone||e.mobile||profile.phone||customer.phone||'—';
    const message=e.message||e.details||e.enquiry||'—';
    const status=enquiryStatus(e.status);
    return `<tr>
      <td><strong>${esc(name)}</strong></td>
      <td>${esc(phone)}</td>
      <td style="max-width:360px;white-space:pre-wrap">${esc(message)}</td>
      <td>
        <div class="actions">
          <button class="btn btn-green btn-sm" onclick="updateEnquiryStatus('${esc(e.id)}','approved')">Approve</button>
          <button class="btn btn-red btn-sm" onclick="updateEnquiryStatus('${esc(e.id)}','cancelled')">Cancel</button>
          <button class="btn btn-light btn-sm" onclick="updateEnquiryStatus('${esc(e.id)}','pending')">Pending</button>
        </div>
        <div style="margin-top:7px"><span class="status ${status==='approved'?'completed':status==='cancelled'?'cancelled':'pending'}">${enquiryStatusLabel(status)}</span></div>
      </td>
      <td><div class="actions">
        <button class="btn btn-blue btn-sm" onclick="editEnquiry('${esc(e.id)}')">✏️ Edit</button>
        <button class="btn btn-red btn-sm" onclick="deleteEnquiry('${esc(e.id)}')">🗑️ Delete</button>
      </div></td>
    </tr>`;
  }).join('');
}

async function updateEnquiryStatus(id,status){
  status=enquiryStatus(status);
  const result=await sb.from('customer_enquiries').update({status}).eq('id',id);
  if(result.error){toast('❌ Status update नहीं हुआ: '+result.error.message);return;}
  toast('✅ Status: '+enquiryStatusLabel(status));
  await loadAll();
}

async function editEnquiry(id){
  const e=enquiries.find(x=>String(x.id)===String(id));
  if(!e)return;
  const message=prompt('Enquiry Message edit करें:',e.details||e.message||e.enquiry||'');
  if(message===null)return;
  const result=await sb.from('customer_enquiries').update({details:message.trim()}).eq('id',id);
  if(result.error){toast('❌ Enquiry edit नहीं हुई: '+result.error.message);return;}
  toast('✅ Enquiry updated');
  await loadAll();
}

"""
          s = s[:start] + new + s[delete_start:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit dashboard patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'Patch customer enquiry controls only'
          git push
