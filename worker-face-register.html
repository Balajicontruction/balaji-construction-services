<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALAJI Construction • Worker Face Registration</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><style>body{margin:0;background:#f4f7fb;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#142235}.wrap{max-width:720px;margin:30px auto;padding:16px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px #0001}.field{margin:14px 0}label{display:block;font-weight:800;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #d9e1e9;border-radius:11px;box-sizing:border-box}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:#ff7f1f;color:#fff}.green{background:#16a34a;color:#fff}.light{background:#edf2f7}.camera{position:relative;width:min(500px,100%);aspect-ratio:4/3;background:#081827;border-radius:18px;overflow:hidden;margin:18px auto}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.msg{padding:12px;border-radius:12px;margin-top:12px}.ok{background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.muted{color:#64748b;font-size:13px}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="card"><h1>👷 Worker Face Registration</h1><p class="muted">पहले Admin Dashboard में worker add करें। फिर यहाँ उसके registered mobile number से पहली बार face register करें।</p><div class="field"><label>Worker का Registered Mobile Number</label><input id="phone" type="tel" inputmode="numeric" placeholder="10 अंकों का mobile number"></div><button class="btn primary" onclick="findWorker()">Worker खोजें</button><div id="workerInfo"></div><div id="registerBox" class="hidden"><div class="camera"><video id="video" autoplay playsinline muted></video></div><div style="text-align:center"><button id="start" class="btn light" onclick="startCamera()">📷 Camera Start</button><button id="capture" class="btn green hidden" onclick="registerFace()">✅ Face Register करें</button></div><div id="status"></div></div></div></div><script>const sb=window.supabase.createClient('https://iefxfyjmyssuiuyncfqz.supabase.co','sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t');let worker=null,stream=null;const q=x=>document.getElementById(x);const norm=x=>String(x||'').replace(/\D/g,'').replace(/^91(?=\d{10}$)/,'').replace(/^0(?=\d{10}$)/,'');function show(t,c='msg'){q('status').innerHTML='<div class="'+c+' msg">'+t+'</div>'}async function findWorker(){const phone=norm(q('phone').value);if(phone.length!==10)return show('सही 10 अंकों का mobile number डालें।','err');const {data,error}=await sb.from('workers').select('id,name,phone,work_role,face_registered,face_descriptor').eq('active',true);if(error)return show(error.message,'err');worker=data?.find(x=>norm(x.phone)===phone);if(!worker)return show('यह mobile number registered active worker का नहीं है।','err');q('workerInfo').innerHTML='<div class="msg ok">Worker: <b>'+((worker.name||'Worker').replace(/[<>]/g,''))+'</b><br>काम: '+((worker.work_role||'-').replace(/[<>]/g,''))+'<br>Face status: '+(worker.face_registered?'Already Registered':'Not Registered')+'</div>';q('registerBox').classList.remove('hidden')}async function startCamera(){try{q('start').disabled=true;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});q('video').srcObject=stream;await loadModels();q('capture').classList.remove('hidden');show('Camera तैयार है। चेहरा सामने रखें।')}catch(e){q('start').disabled=false;show('Camera शुरू नहीं हुआ: '+e.message,'err')}}let loaded=false;async function loadModels(){if(loaded)return;show('Face model load हो रहा है...');const base='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';await faceapi.nets.tinyFaceDetector.loadFromUri(base);await faceapi.nets.faceLandmark68Net.loadFromUri(base);await faceapi.nets.faceRecognitionNet.loadFromUri(base);loaded=true}async function registerFace(){if(!worker||!stream)return;const video=q('video');const detections=await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55})).withFaceLandmarks().withFaceDescriptors();if(detections.length!==1)return show(detections.length>1?'एक समय में केवल एक चेहरा रखें।':'चेहरा साफ और सामने रखें।','err');const desc=Array.from(detections[0].descriptor);const {error}=await sb.from('workers').update({face_descriptor:desc,face_registered:true,face_registered_at:new Date().toISOString()}).eq('id',worker.id);if(error)return show('Face save नहीं हुआ: '+error.message,'err');const {error:re}=await sb.from('worker_face_registrations').upsert({worker_id:worker.id,face_descriptor:desc,registered_at:new Date().toISOString()}, {onConflict:'worker_id'});if(re)return show('Face registration record save नहीं हुआ: '+re.message,'err');show('✅ Face Registration सफल हो गया। अब attendance के समय इसी registered face से matching की जा सकती है।','ok');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}q('capture').classList.add('hidden')}</script></body></html>
