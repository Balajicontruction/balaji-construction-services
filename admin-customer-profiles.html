<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALAJI Construction • Customer Profiles</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#0b1f33;--o:#f58220;--bg:#f4f7fb;--c:#fff;--t:#142235;--m:#6b7788;--l:#e4e9f0}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--t)}.head{background:var(--n);color:#fff;padding:18px}.headin,.wrap{width:min(1200px,92%);margin:auto}.headin{display:flex;justify-content:space-between;align-items:center}.wrap{padding:25px 0}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.customer{display:grid;grid-template-columns:90px 1fr;gap:15px;align-items:center}.photo{width:85px;height:85px;border-radius:50%;object-fit:cover;background:#eef2f7}.placeholder{display:grid;place-items:center;font-size:35px}.info{color:var(--m);font-size:13px;line-height:1.7}.project{margin-top:12px;padding:12px;border-radius:12px;background:#f4f7fb;border:1px solid var(--l);font-size:13px;line-height:1.6}.project b{color:var(--t)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.secondary{background:#eef2f7;color:var(--t)}.search{width:100%;padding:12px;border:1px solid var(--l);border-radius:11px;margin:12px 0 18px}.muted{color:var(--m);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:550px){.customer{grid-template-columns:1fr;text-align:center}}
</style></head><body><header class="head"><div class="headin"><div><b style="font-size:20px">BALAJI Construction Services</b><div style="font-size:12px;color:#b9c7d5">Admin • Customer Profiles</div></div><button class="btn secondary" onclick="location.href='dashboard.html'">← Dashboard</button></div></header><main class="wrap"><div class="card"><h2 style="margin:0">👥 Customer Profiles</h2><p class="muted">Customer का नाम, photo, mobile number, पूरा address और project एक जगह देखें।</p><input id="search" class="search" placeholder="🔎 नाम, mobile या गाँव से खोजें..." oninput="render()"><div id="list" class="grid">Loading...</div></div></main><script>const sb=window.supabase.createClient('https://iefxfyjmyssuiuyncfqz.supabase.co','sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t');let rows=[];const q=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(){const s=q('search').value.toLowerCase().trim();const x=rows.filter(c=>[c.name,c.phone,c.village,c.address,(c.projects||[]).map(p=>[p.project_name,p.work_type,p.status].join(' ')).join(' ')].join(' ').toLowerCase().includes(s));q('list').innerHTML=x.length?`<div style="overflow-x:auto;grid-column:1/-1"><table style="width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--l);border-radius:14px;overflow:hidden"><thead><tr style="background:#f4f7fb"><th style="padding:13px;text-align:left">Customer</th><th style="padding:13px;text-align:left">Phone</th><th style="padding:13px;text-align:left">Village</th><th style="padding:13px;text-align:left">Address</th><th style="padding:13px;text-align:left">Project</th><th style="padding:13px;text-align:left">Actions</th></tr></thead><tbody>${x.map(c=>`<tr style="border-top:1px solid var(--l)"><td style="padding:13px"><div style="display:flex;align-items:center;gap:10px">${c.photo_url?`<img class="photo" style="width:50px;height:50px" src="${esc(c.photo_url)}" alt="Customer">`:'<div class="photo placeholder" style="width:50px;height:50px;font-size:22px">👤</div>'}<b>${esc(c.name||'Customer')}</b></div></td><td style="padding:13px">${esc(c.phone||'—')}</td><td style="padding:13px">${esc(c.village||'—')}</td><td style="padding:13px">${esc(c.address||'—')}</td><td style="padding:13px;min-width:190px">${(c.projects||[]).length?c.projects.map(p=>`<div style="margin-bottom:6px"><b>🏗️ ${esc(p.project_name||p.work_type||'Project')}</b><br><small>${p.work_type&&p.work_type!==p.project_name?esc(p.work_type)+' • ':''}${esc(p.status||'—')}</small></div>`).join(''):'—'}</td><td style="padding:13px"><div class="actions"><a class="btn secondary" href="tel:${esc(c.phone||'')}">📞 Call</a>${c.photo_url?`<a class="btn secondary" target="_blank" href="${esc(c.photo_url)}">📷 Photo</a>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">कोई customer नहीं मिला।</div>'}async function start(){const{data}=await sb.auth.getSession();if(!data.session){location.href='dashboard.html';return}const{data:p}=await sb.from('profiles').select('role').eq('id',data.session.user.id).maybeSingle();if(!['owner','manager','staff','admin'].includes(p?.role)){location.href='customer-dashboard.html';return}const{data:c,error}=await sb.from('customers').select('id,name,phone,village,address,photo_url').order('created_at',{ascending:false});if(error){q('list').textContent=error.message;return}const ids=(c||[]).map(x=>x.id);let projects=[];if(ids.length){const r=await sb.from('projects').select('id,customer_id,project_name,work_type,status,start_date,expected_end_date').in('customer_id',ids).order('created_at',{ascending:false});if(!r.error)projects=r.data||[]}const byCustomer={};projects.forEach(p=>{(byCustomer[p.customer_id]??=[]).push(p)});rows=(c||[]).map(x=>({...x,projects:byCustomer[x.id]||[]}));render()}start();</script></body></html>
