<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALAJI Construction • Customer Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#0b1f33;--o:#f58220;--bg:#f4f7fb;--c:#fff;--t:#142235;--m:#6b7788;--l:#e4e9f0}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--t)}.wrap{width:min(850px,92%);margin:auto;padding:30px 0}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:25px;box-shadow:0 10px 30px #00000008}.head{background:var(--n);color:#fff;padding:18px}.headin{width:min(850px,92%);margin:auto;display:flex;justify-content:space-between;align-items:center}.profile{display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:center}.photo{width:170px;height:170px;border-radius:50%;object-fit:cover;border:5px solid #fff3;background:#eef2f7}.placeholder{display:grid;place-items:center;font-size:70px}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:13px;border:1px solid var(--l);border-radius:13px}.item small{display:block;color:var(--m);margin-bottom:5px}.item b{word-break:break-word}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.secondary{background:#eef2f7;color:var(--t)}input{padding:11px;border:1px solid var(--l);border-radius:10px;width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap}.msg{font-size:13px;margin-top:10px}@media(max-width:650px){.profile{grid-template-columns:1fr;text-align:center}.info{grid-template-columns:1fr}.actions{justify-content:center}}
</style></head><body><header class="head"><div class="headin"><b>BALAJI Construction Services</b><button class="btn secondary" onclick="logout()">Logout</button></div></header><main class="wrap"><div class="card"><div id="loading">Profile load हो रही है...</div><div id="profile" class="hidden"><div class="profile"><div><img id="photo" class="photo" alt="Customer Photo"><div id="photoPlaceholder" class="photo placeholder">👤</div></div><div><h1 id="name" style="margin:0 0 18px"></h1><div class="info"><div class="item"><small>📱 Mobile Number</small><b id="phone">—</b></div><div class="item"><small>📧 Email</small><b id="email">—</b></div><div class="item"><small>🏘️ Village</small><b id="village">—</b></div><div class="item"><small>📍 Address</small><b id="address">—</b></div></div></div></div><hr style="border:0;border-top:1px solid var(--l);margin:25px 0"><h3>📷 Profile Photo</h3><p style="color:var(--m);font-size:13px">अपनी पहचान के लिए profile photo upload करें।</p><div class="actions"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn primary" onclick="uploadPhoto()">Photo Upload करें</button></div><p id="msg" class="msg"></p></div></div></main><script>const sb=window.supabase.createClient('https://iefxfyjmyssuiuyncfqz.supabase.co','sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t');let user,customer;const q=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function start(){const{data}=await sb.auth.getSession();if(!data.session){location.href='customer-dashboard.html';return}user=data.session.user;const{data:c,error}=await sb.from('customers').select('id,name,phone,village,address,photo_url').eq('user_id',user.id).maybeSingle();if(error||!c){q('loading').textContent='Customer profile नहीं मिला।';return}customer=c;q('loading').classList.add('hidden');q('profile').classList.remove('hidden');q('name').textContent=c.name||'Customer';q('phone').textContent=c.phone||'—';q('email').textContent=user.email||'—';q('village').textContent=c.village||'—';q('address').textContent=c.address||'—';if(c.photo_url){q('photo').src=c.photo_url;q('photo').style.display='block';q('photoPlaceholder').style.display='none'}else{q('photo').style.display='none';q('photoPlaceholder').style.display='grid'}}async function uploadPhoto(){const f=q('file').files[0];if(!f)return q('msg').textContent='पहले photo select करें।';if(f.size>5*1024*1024)return q('msg').textContent='Photo 5 MB से छोटी होनी चाहिए।';const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=user.id+'/'+Date.now()+'.'+ext;q('msg').textContent='Uploading...';const{error}=await sb.storage.from('customer-profile-photos').upload(path,f,{upsert:true,contentType:f.type});if(error)return q('msg').textContent=error.message;const{data}=sb.storage.from('customer-profile-photos').getPublicUrl(path);const{error:ue}=await sb.from('customers').update({photo_url:data.publicUrl,updated_at:new Date().toISOString()}).eq('id',customer.id);if(ue)return q('msg').textContent=ue.message;q('photo').src=data.publicUrl;q('photo').style.display='block';q('photoPlaceholder').style.display='none';q('msg').textContent='Profile photo successfully update हो गई।'}async function logout(){await sb.auth.signOut();location.href='customer-dashboard.html'}start();</script></body></html>
