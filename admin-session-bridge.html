<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALAJI Construction • Secure Admin Session</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071b2e;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#fff}.box{background:#fff;color:#172333;padding:30px;border-radius:22px;width:min(420px,90%);text-align:center;box-shadow:0 30px 80px #0006}.logo{width:58px;height:58px;margin:0 auto 15px;border-radius:18px;background:#f58220;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.msg{color:#64748b;font-size:14px}</style>
</head>
<body><main class="box"><div class="logo">BC</div><h2>Admin Dashboard</h2><p id="msg" class="msg">Secure session तैयार की जा रही है...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://iefxfyjmyssuiuyncfqz.supabase.co';
const SUPABASE_KEY='sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const msg=document.getElementById('msg');
(async()=>{
 try{
  const hash=new URLSearchParams(location.hash.slice(1));
  const access_token=hash.get('access_token');
  const refresh_token=hash.get('refresh_token');
  if(!access_token||!refresh_token) throw new Error('Admin session token नहीं मिला।');
  const {data,error}=await sb.auth.setSession({access_token,refresh_token});
  if(error) throw error;
  if(!data.session||!data.user) throw new Error('Secure session स्थापित नहीं हो सकी।');
  const {data:profile,error:pe}=await sb.from('profiles').select('role').eq('id',data.user.id).maybeSingle();
  if(pe) throw pe;
  if(!['owner','manager','staff','admin'].includes((profile?.role||'').toLowerCase())) throw new Error('Admin role verify नहीं हुआ।');
  msg.textContent='Login सफल। Dashboard खोला जा रहा है...';
  history.replaceState(null,'',location.pathname);
  setTimeout(()=>location.replace('dashboard.html?admin_session=1'),100);
 }catch(e){
  console.error(e); msg.textContent=e?.message||'Admin session error';
  setTimeout(()=>location.replace('admin-login.html?session_error=1'),1800);
 }
})();
</script></body></html>
