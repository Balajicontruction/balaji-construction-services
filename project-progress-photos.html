<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALAJI • Project Progress Update</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f4f7fb;color:#142235}.wrap{max-width:1000px;margin:auto;padding:20px}.box{background:#fff;border:1px solid #e4e9f0;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #0f172a0d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:800;margin:10px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #d8dee8;border-radius:10px;font-size:15px}textarea{min-height:105px;resize:vertical}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;background:#f58220;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#eaf0f6;color:#142235}.muted{color:#64748b}.status{padding:12px;border-radius:10px;margin:12px 0;font-weight:700}.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.project{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:15px;margin:14px 0}.photoBox{border:2px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center;background:#f8fafc}.preview{display:none;max-width:100%;max-height:320px;margin:14px auto 0;border-radius:14px;object-fit:contain}.progressBar{height:14px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progressFill{height:100%;width:0;background:#f58220;transition:.3s}.actions{display:flex;gap:10px;flex-wrap:wrap}.update{border:1px solid #e2e8f0;border-radius:14px;padding:15px;margin-bottom:12px;background:#f8fafc}.update img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-top:12px}.date{color:#64748b;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<div class="box">
<h1>📈 Project Progress Update</h1>
<p class="muted">Admin Dashboard से चुने गए Project की daily progress और photo Customer Dashboard पर भेजें।</p>
<div id="message"></div><div id="projectInfo"></div>
<div class="grid">
<div><label>📅 काम की तारीख</label><input id="updateDate" type="date"></div>
<div><label>📊 Project Progress (%)</label><input id="progress" type="number" min="0" max="100" value="0"></div>
<div class="full"><label>🏗️ आज का काम *</label><input id="title" placeholder="जैसे छत की shuttering पूरी की"></div>
<div class="full"><label>📝 काम की पूरी जानकारी *</label><textarea id="details" placeholder="आज क्या काम हुआ, कितना काम हुआ, कौन सा हिस्सा पूरा हुआ..."></textarea></div>
<div class="full"><label>📌 Customer के लिए Note</label><textarea id="note" placeholder="Customer को दिखाई देने वाली जरूरी जानकारी..."></textarea></div>
<div class="full"><label>📷 आज के काम की Photo</label><div class="photoBox"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div id="fileInfo" class="muted">अधिकतम 5 MB • JPG / PNG / WEBP</div><img id="preview" class="preview" alt="Photo Preview"></div></div>
</div>
<div style="margin-top:16px"><div style="display:flex;justify-content:space-between"><b>Progress</b><b id="progressText">0%</b></div><div class="progressBar"><div id="progressFill" class="progressFill"></div></div></div>
<br><div class="actions"><button id="saveBtn" onclick="saveProgress()">💾 Save Progress + Photo</button><button class="secondary" onclick="resetForm()">↻ Reset</button></div>
</div>
<div class="box"><h2>📋 Previous Updates</h2><div id="history">Loading...</div></div>
</div>
<script>
const SUPABASE_URL='https://iefxfyjmyssuiuyncfqz.supabase.co';
const SUPABASE_KEY='sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const projectId=new URLSearchParams(location.search).get('project_id');
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(t,type='info'){$('message').innerHTML='<div class="status '+type+'">'+t+'</div>'}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('updateDate').value=d.toISOString().slice(0,10)}
function progressBar(){let p=Math.max(0,Math.min(100,Number($('progress').value||0)));$('progressText').textContent=p+'%';$('progressFill').style.width=p+'%'}
$('progress').addEventListener('input',progressBar);
$('photo').addEventListener('change',function(){const f=this.files?.[0];if(!f)return;if(f.size>5*1024*1024){message('❌ Photo 5 MB से छोटी होनी चाहिए।','err');this.value='';$('preview').style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(f.type)){message('❌ केवल JPG, PNG या WEBP photo upload करें।','err');this.value='';return}$('fileInfo').textContent=f.name+' • '+(f.size/1024/1024).toFixed(2)+' MB';$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'});
async function requireAdmin(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){message('❌ Admin login session नहीं मिली। पहले Admin Dashboard में login करें।','err');return null}const {data:allowed,error:roleError}=await sb.rpc('is_staff_or_admin');if(roleError||allowed!==true){message('❌ इस page को खोलने की अनुमति नहीं है। Admin Dashboard से ही Project Progress update करें।','err');return null}return user}
async function loadProject(){if(!projectId){message('❌ Project ID नहीं मिली। Admin Dashboard से Project tap करके खोलें।','err');$('history').innerHTML='<div class="status err">Project select नहीं है।</div>';return}const user=await requireAdmin();if(!user)return;const {data,error}=await sb.from('projects').select('id,project_name,work_type,location,status').eq('id',projectId).single();if(error){message('❌ Project load नहीं हुआ: '+esc(error.message),'err');return}$('projectInfo').innerHTML='<div class="project"><h2>🏠 '+esc(data.project_name||'Project')+'</h2><div><b>काम:</b> '+esc(data.work_type||'—')+'</div><div><b>स्थान:</b> '+esc(data.location||'—')+'</div><div><b>Status:</b> '+esc(data.status||'—')+'</div></div>';message('✅ Project तैयार है। आज का काम update करें।','ok');await loadHistory()}
async function loadHistory(){const {data,error}=await sb.from('project_updates').select('id,update_date,title,details,progress_percent,photo_url,created_at').eq('project_id',projectId).order('update_date',{ascending:false}).order('created_at',{ascending:false});if(error){$('history').innerHTML='<div class="status err">'+esc(error.message)+'</div>';return}if(!data?.length){$('history').innerHTML='<div class="status info">अभी इस Project की कोई progress update नहीं है।</div>';return}$('history').innerHTML=data.map(u=>'<div class="update"><div class="date">📅 '+esc(u.update_date||'—')+'</div><h3>'+esc(u.title||'काम का Update')+'</h3><div>'+esc(u.details||'').replace(/\n/g,'<br>')+'</div><br><b>📊 Progress: '+Number(u.progress_percent||0)+'%</b>'+(u.photo_url?'<img src="'+esc(u.photo_url)+'" alt="Project Progress Photo">':'')+'</div>').join('')}
async function saveProgress(){const user=await requireAdmin();if(!user)return;const title=$('title').value.trim(),details=$('details').value.trim(),note=$('note').value.trim(),date=$('updateDate').value,file=$('photo').files?.[0]||null;let progress=Math.max(0,Math.min(100,Number($('progress').value||0)));if(!date)return message('❌ Date चुनें।','err');if(!title||!details)return message('❌ आज का काम और पूरी जानकारी भरें।','err');if(file&&file.size>5*1024*1024)return message('❌ Photo 5 MB से छोटी होनी चाहिए।','err');if(file&&!['image/jpeg','image/png','image/webp'].includes(file.type))return message('❌ केवल JPG, PNG या WEBP photo upload करें।','err');$('saveBtn').disabled=true;message(file?'📷 Photo upload हो रही है...':'💾 Progress save हो रही है...','info');let uploadedPath=null;try{let photoUrl=null;if(file){const ext=file.name.split('.').pop().toLowerCase();uploadedPath=projectId+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;const up=await sb.storage.from('project-progress-photos').upload(uploadedPath,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(up.error)throw new Error('Photo upload नहीं हुई: '+up.error.message);photoUrl=sb.storage.from('project-progress-photos').getPublicUrl(uploadedPath).data.publicUrl}const finalDetails=note?details+'\n\nCustomer Note: '+note:details;const ins=await sb.from('project_updates').insert({project_id:projectId,update_date:date,title,details:finalDetails,progress_percent:progress,photo_url:photoUrl,created_by:user.id});if(ins.error){if(uploadedPath)await sb.storage.from('project-progress-photos').remove([uploadedPath]);throw new Error('Progress save नहीं हुई: '+ins.error.message)}message('✅ Progress save हो गई। '+(photoUrl?'📷 Photo भी Customer Dashboard पर दिखाई देगी।':''),'ok');$('title').value='';$('details').value='';$('note').value='';$('progress').value=progress;progressBar();$('photo').value='';$('preview').style.display='none';$('fileInfo').textContent='अधिकतम 5 MB • JPG / PNG / WEBP';await loadHistory()}catch(e){message('❌ '+esc(e.message),'err')}finally{$('saveBtn').disabled=false}}
function resetForm(){$('title').value='';$('details').value='';$('note').value='';$('progress').value=0;progressBar();$('photo').value='';$('preview').style.display='none';$('fileInfo').textContent='अधिकतम 5 MB • JPG / PNG / WEBP';message('Form reset हो गया।','info')}
today();progressBar();loadProject();
</script>
</body>
</html>
