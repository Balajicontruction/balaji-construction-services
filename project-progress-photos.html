<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALAJI • Update Project Progress</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f4f7fb;
  color:#142235;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.box{
  background:#fff;
  border:1px solid #e4e9f0;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(15,23,42,.05);
}

h1,h2{
  margin-top:0;
}

.muted{
  color:#64748b;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:6px;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d8dee8;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#f58220;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer;
  background:#f58220;
  color:#fff;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary{
  background:#eaf0f6;
  color:#142235;
}

.project{
  background:#fff7ed;
  border:1px solid #fed7aa;
  border-radius:14px;
  padding:15px;
  margin-bottom:16px;
}

.status{
  padding:12px;
  border-radius:10px;
  margin:12px 0;
  font-weight:700;
}

.ok{
  background:#f0fdf4;
  color:#15803d;
  border:1px solid #bbf7d0;
}

.err{
  background:#fef2f2;
  color:#dc2626;
  border:1px solid #fecaca;
}

.info{
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
}

.photoBox{
  border:2px dashed #cbd5e1;
  border-radius:14px;
  padding:18px;
  text-align:center;
  background:#f8fafc;
}

.preview{
  display:none;
  max-width:100%;
  max-height:320px;
  margin:15px auto 0;
  border-radius:14px;
  object-fit:contain;
}

.progressWrap{
  margin-top:10px;
}

.progressBar{
  height:14px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  width:0%;
  background:#f58220;
  transition:.3s;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.history{
  margin-top:10px;
}

.update{
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  background:#f8fafc;
}

.update img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin-top:12px;
}

.updateDate{
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="box">

    <h1>📈 Project Progress Update</h1>

    <p class="muted">
      Admin Dashboard से चुने गए Project की daily progress यहाँ update करें।
    </p>

    <div id="message"></div>

    <div id="projectInfo"></div>

    <div class="grid">

      <div>
        <label>📅 काम की तारीख</label>
        <input id="updateDate" type="date">
      </div>

      <div>
        <label>📊 Project Progress (%)</label>
        <input id="progress" type="number" min="0" max="100" value="0">
      </div>

      <div class="full">
        <label>🏗️ आज का काम *</label>
        <input
          id="title"
          type="text"
          placeholder="जैसे छत की shuttering पूरी की"
        >
      </div>

      <div class="full">
        <label>📝 काम की पूरी जानकारी *</label>
        <textarea
          id="details"
          placeholder="आज क्या काम हुआ, कितना काम हुआ, कौन सा हिस्सा पूरा हुआ..."
        ></textarea>
      </div>

      <div>
        <label>💰 आज का खर्च ₹</label>
        <input id="amount" type="number" min="0" value="0">
      </div>

      <div>
        <label>👷 Workers</label>
        <input id="workers" type="number" min="0" value="0">
      </div>

      <div class="full">
        <label>📌 Customer के लिए Note</label>
        <textarea
          id="note"
          placeholder="Customer को दिखाई देने वाली जरूरी जानकारी..."
        ></textarea>
      </div>

      <div class="full">

        <label>📷 आज के काम की Photo</label>

        <div class="photoBox">

          <input
            id="photo"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >

          <div id="fileInfo" class="muted">
            अधिकतम 5 MB • JPG / PNG / WEBP
          </div>

          <img
            id="preview"
            class="preview"
            alt="Photo Preview"
          >

        </div>

      </div>

    </div>

    <div class="progressWrap">

      <div style="display:flex;justify-content:space-between">
        <b>Current Progress</b>
        <b id="progressText">0%</b>
      </div>

      <div class="progressBar">
        <div id="progressFill" class="progressFill"></div>
      </div>

    </div>

    <br>

    <div class="actions">

      <button id="saveBtn" onclick="saveProgress()">
        💾 Save Progress
      </button>

      <button class="secondary" onclick="resetForm()">
        ↻ Reset
      </button>

    </div>

  </div>


  <div class="box">

    <h2>📋 Previous Updates</h2>

    <div id="history">
      Loading...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
'https://iefxfyjmyssuiuyncfqz.supabase.co';

const SUPABASE_KEY =
'sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t';

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const params =
new URLSearchParams(window.location.search);

const projectId =
params.get('project_id');

const $ = id =>
document.getElementById(id);


function today(){

  const d =
  new Date();

  const local =
  new Date(
    d.getTime() -
    d.getTimezoneOffset()*60000
  );

  $('updateDate').value =
  local.toISOString().slice(0,10);
}


function message(text,type='info'){

  $('message').innerHTML =
  `<div class="status ${type}">
    ${text}
  </div>`;

}


function esc(value){

  return String(value ?? '')
    .replace(/[&<>"']/g,c=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[c]));

}


function updateProgressBar(){

  let p =
  Number($('progress').value || 0);

  p =
  Math.max(
    0,
    Math.min(100,p)
  );

  $('progressText').textContent =
  p+'%';

  $('progressFill').style.width =
  p+'%';

}


$('progress').addEventListener(
  'input',
  updateProgressBar
);


$('photo').addEventListener(
  'change',
  function(){

    const file =
    this.files?.[0];

    if(!file) return;

    if(file.size > 5*1024*1024){

      message(
        '❌ Photo 5 MB से छोटी होनी चाहिए।',
        'err'
      );

      this.value='';

      $('preview').style.display='none';

      return;
    }

    $('fileInfo').textContent =
    file.name+
    ' • '+
    (file.size/1024/1024).toFixed(2)+
    ' MB';

    $('preview').src =
    URL.createObjectURL(file);

    $('preview').style.display =
    'block';

  }
);


async function loadProject(){

  if(!projectId){

    message(
      '❌ Project ID नहीं मिली। Admin Dashboard से Project खोलें।',
      'err'
    );

    $('history').innerHTML =
    '<div class="status err">Project select नहीं है।</div>';

    return;
  }


  message(
    'Project information load हो रही है...',
    'info'
  );


  const {
    data,
    error
  } =
  await sb
  .from('projects')
  .select(`
    id,
    project_name,
    work_type,
    location,
    status,
    customer_id
  `)
  .eq('id',projectId)
  .single();


  if(error){

    message(
      '❌ Project load नहीं हुआ: '+
      esc(error.message),
      'err'
    );

    return;
  }


  $('projectInfo').innerHTML = `

    <div class="project">

      <h2>🏠 ${esc(data.project_name || 'Project')}</h2>

      <div>
        <b>काम:</b>
        ${esc(data.work_type || '—')}
      </div>

      <div>
        <b>स्थान:</b>
        ${esc(data.location || '—')}
      </div>

      <div>
        <b>Status:</b>
        ${esc(data.status || '—')}
      </div>

    </div>

  `;


  message(
    '✅ Project तैयार है। आज का काम update करें।',
    'ok'
  );


  await loadHistory();

}


async function loadHistory(){

  const {
    data,
    error
  } =
  await sb
  .from('project_updates')
  .select(`
    id,
    update_date,
    title,
    details,
    progress_percent,
    photo_url,
    created_at
  `)
  .eq('project_id',projectId)
  .order('update_date',{ascending:false})
  .order('created_at',{ascending:false});


  if(error){

    $('history').innerHTML =
    `<div class="status err">
      ${esc(error.message)}
    </div>`;

    return;
  }


  if(!data?.length){

    $('history').innerHTML =
    `<div class="status info">
      अभी इस Project की कोई progress update नहीं है।
    </div>`;

    return;
  }


  $('history').innerHTML =
  data.map(u=>`

    <div class="update">

      <div class="updateDate">
        📅 ${esc(u.update_date || '—')}
      </div>

      <h3>
        ${esc(u.title || 'काम का अपडेट')}
      </h3>

      <div>
        ${esc(u.details || '').replace(/\n/g,'<br>')}
      </div>

      <br>

      <b>
        📊 Progress:
        ${Number(u.progress_percent || 0)}%
      </b>

      ${
        u.photo_url
        ?
        `<img
          src="${esc(u.photo_url)}"
          alt="Project Progress Photo"
        >`
        :
        ''
      }

    </div>

  `).join('');

}


async function saveProgress(){

  if(!projectId){

    message(
      '❌ Project ID नहीं मिली।',
      'err'
    );

    return;
  }


  const title =
  $('title').value.trim();

  const details =
  $('details').value.trim();

  const note =
  $('note').value.trim();

  const date =
  $('updateDate').value;

  let progress =
  Number($('progress').value || 0);

  const amount =
  Number($('amount').value || 0);

  const workers =
  Number($('workers').value || 0);

  const file =
  $('photo').files?.[0] || null;


  if(!date){

    message(
      '❌ Date चुनें।',
      'err'
    );

    return;
  }


  if(!title){

    message(
      '❌ आज के काम का title लिखें।',
      'err'
    );

    return;
  }


  if(!details){

    message(
      '❌ काम की जानकारी लिखें।',
      'err'
    );

    return;
  }


  if(file){

    if(file.size > 5*1024*1024){

      message(
        '❌ Photo 5 MB से छोटी होनी चाहिए।',
        'err'
      );

      return;
    }


    if(
      ![
        'image/jpeg',
        'image/png',
        'image/webp'
      ].includes(file.type)
    ){

      message(
        '❌ केवल JPG, PNG या WEBP photo upload करें।',
        'err'
      );

      return;
    }

  }


  progress =
  Math.max(
    0,
    Math.min(100,progress)
  );


  $('saveBtn').disabled =
  true;

  $('saveBtn').textContent =
  '⏳ Saving...';


  try{

    let photoUrl =
    null;


    /*
      PHOTO UPLOAD
    */

    if(file){

      message(
        '📷 Photo upload हो रही है...',
        'info'
      );


      const ext =
      file.name
      .split('.')
      .pop()
      .toLowerCase();


      const path =
      projectId+
      '/'+
      Date.now()+
      '-'+
      Math.random()
      .toString(36)
      .slice(2,8)+
      '.'+
      ext;


      const upload =
      await sb
      .storage
      .from('project-progress-photos')
      .upload(
        path,
        file,
        {
          cacheControl:'3600',
          upsert:false,
          contentType:file.type
        }
      );


      if(upload.error){

        throw new Error(
          'Photo upload failed: '+
          upload.error.message
        );

      }


      const publicData =
      sb
      .storage
      .from('project-progress-photos')
      .getPublicUrl(path);


      photoUrl =
      publicData
      .data
      .publicUrl;

    }


    /*
      DATABASE INSERT
    */

    message(
      '💾 Progress save हो रही है...',
      'info'
    );


    const finalDetails =
    note
    ?
    details+
    '\n\nCustomer Note: '+
    note
    :
    details;


    const {
      error
    } =
    await sb
    .from('project_updates')
    .insert({

      project_id:
      projectId,

      update_date:
      date,

      title:
      title,

      details:
      finalDetails,

      progress_percent:
      progress,

      photo_url:
      photoUrl

    });


    if(error){

      throw new Error(
        'Progress save failed: '+
        error.message
      );

    }


    /*
      SUCCESS
    */

    message(
      '✅ Project Progress सफलतापूर्वक save हो गई। Customer Dashboard में update दिखाई देगी।',
      'ok'
    );


    $('title').value='';
    $('details').value='';
    $('note').value='';
    $('amount').value=0;
    $('workers').value=0;
    $('photo').value='';

    $('preview').style.display='none';

    $('fileInfo').textContent =
    'अधिकतम 5 MB • JPG / PNG / WEBP';


    await loadHistory();


  }catch(error){

    console.error(error);

    message(
      '❌ '+esc(error.message),
      'err'
    );

  }finally{

    $('saveBtn').disabled =
    false;

    $('saveBtn').textContent =
    '💾 Save Progress';

  }

}


function resetForm(){

  $('title').value='';
  $('details').value='';
  $('note').value='';
  $('amount').value=0;
  $('workers').value=0;
  $('progress').value=0;
  $('photo').value='';

  $('preview').style.display='none';

  $('fileInfo').textContent =
  'अधिकतम 5 MB • JPG / PNG / WEBP';

  updateProgressBar();

}


today();

updateProgressBar();

loadProject();

</script>

</body>
</html>
