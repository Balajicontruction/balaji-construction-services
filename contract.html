<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALAJI Construction • Contract</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f4f7fb;color:#142235}.wrap{width:min(1050px,94%);margin:28px auto 60px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.muted{color:#718096}.card{background:#fff;border:1px solid #e5eaf0;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px rgba(9,31,51,.06)}.hero{background:linear-gradient(135deg,#0b2238,#123956);color:#fff}.hero .muted{color:#c8d5e1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{background:#f8fafc;border:1px solid #e5eaf0;border-radius:13px;padding:12px}.field small{display:block;color:#718096;margin-bottom:5px}.field b{word-break:break-word}.amount{font-size:34px;font-weight:900;color:#f58220}.pill{display:inline-flex;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:900;background:#eef7f0;color:#15803d}.pill.pending{background:#fff7ed;color:#c2410c}.pill.danger{background:#fee2e2;color:#b91c1c}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:900;cursor:pointer}.primary{background:#f58220;color:#fff}.green{background:#16a34a;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.secondary{background:#edf2f7;color:#142235}input,textarea{width:100%;padding:12px;border:1px solid #d9e1e9;border-radius:11px}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.schedule{width:100%;border-collapse:collapse}.schedule th,.schedule td{padding:10px;border-bottom:1px solid #e5eaf0;text-align:left}.history{border-left:3px solid #f58220;padding-left:15px}.historyItem{padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid #e5eaf0}.sign{min-height:110px}.center{text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.amount{font-size:28px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">🏗️ BALAJI Construction Services</div><div class="muted">Project Contract</div></div><button class="btn secondary" onclick="history.back()">← वापस</button></div><div id="app"><div class="card center">Contract loading...</div></div></div><script>
const sb=window.supabase.createClient('https://iefxfyjmyssuiuyncfqz.supabase.co','sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t');const id=new URLSearchParams(location.search).get('project_id');let contract=null,project=null,isStaff=false,user=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function statusText(s){return ({amount_pending_customer:'Customer से Amount Approval बाकी',amount_pending_admin:'Admin से Amount Approval बाकी',revision_required:'Amount / Contract Revision Required',contract_pending_customer:'Customer Contract Approval बाकी',contract_pending_admin:'Admin Contract Approval बाकी',locked:'🔒 Contract Locked',legacy_locked:'🔒 Existing Contract Locked'}[s]||s)}function promptReason(t){const r=prompt(t);if(r===null||!r.trim()){if(r!==null)alert('Reason जरूरी है।');return null}return r.trim()}async function load(){if(!id){$('app').innerHTML='<div class="card">Project ID नहीं मिला।</div>';return}const ses=await sb.auth.getSession();user=ses.data.session?.user;if(!user){location.href='index.html';return}const prof=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();isStaff=['admin','owner','manager','staff'].includes(String(prof.data?.role||'').toLowerCase());const pr=await sb.from('projects').select('*').eq('id',id).single();if(pr.error){$('app').innerHTML='<div class="card">Project नहीं मिला।</div>';return}project=pr.data;const cr=await sb.from('project_contracts').select('*').eq('project_id',id).single();if(cr.error){$('app').innerHTML='<div class="card">Contract अभी उपलब्ध नहीं है।</div>';return}contract=cr.data;render();loadHistory()}function render(){const c=contract,s=c.status;let buttons='';if(s==='amount_pending_customer'){if(!isStaff&&c.amount_proposed_by==='Admin')buttons='<div class="actions"><button class="btn green" onclick="amountDecision(true)">✅ Amount Approve</button><button class="btn danger" onclick="amountDecision(false)">❌ Reject / Revision</button></div>'}else if(s==='amount_pending_admin'){if(isStaff&&c.amount_proposed_by==='Customer')buttons='<div class="actions"><button class="btn green" onclick="amountDecision(true)">✅ Amount Approve</button><button class="btn danger" onclick="amountDecision(false)">❌ Reject / Revision</button></div>'}else if(s==='revision_required'){buttons='<div class="card" style="background:#fff7ed"><b>नया Final Amount propose करें</b><label style="display:block;margin:10px 0 6px">Final Amount</label><input id="newAmount" type="number" min="1" value="'+esc(c.amount||'')+'"><label style="display:block;margin:10px 0 6px">Reason / Notes</label><textarea id="newReason" placeholder="Amount या Contract revision का कारण"></textarea><div class="actions"><button class="btn primary" onclick="propose()">📤 '+(isStaff?'Admin':'Customer')+' Proposal Send करें</button></div></div>'}else if(s==='contract_pending_customer'&&!isStaff){buttons='<div class="actions"><button class="btn green" onclick="contractDecision(true)">✅ Contract Approve</button><button class="btn danger" onclick="contractDecision(false)">❌ Reject / Revision</button></div>'}else if(s==='contract_pending_admin'&&isStaff){buttons='<div class="actions"><button class="btn green" onclick="adminApprove()">✅ Final Admin Approval</button><button class="btn danger" onclick="adminReject()">❌ Reject / Revision</button></div>'}else if(s==='locked'&&isStaff){buttons='<div class="actions"><button class="btn primary" onclick="newVersion()">＋ New Contract Version</button></div>'}$('app').innerHTML='<div class="card hero"><div style="font-size:12px;letter-spacing:.12em;font-weight:900;color:#ffab57">CONSTRUCTION AGREEMENT</div><h1 style="margin:8px 0 5px">'+esc(project.project_name||project.work_type||'Project')+'</h1><div class="muted">'+esc(project.location||c.site_address||'—')+'</div><div style="margin-top:14px"><span class="pill '+(s==='locked'||s==='legacy_locked'?'':'pending')+'">'+esc(statusText(s))+'</span></div></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin:0">Final Amount</h2><div class="muted">Proposed by: '+esc(c.amount_proposed_by||'—')+'</div></div><div class="amount">'+money(c.amount)+'</div></div>'+(c.amount_reason?'<div class="field" style="margin-top:12px"><b>Amount Notes:</b><br>'+esc(c.amount_reason)+'</div>':'')+(c.rejection_reason?'<div class="field" style="margin-top:12px;background:#fee2e2"><b>Last Reason:</b><br>'+esc(c.rejection_reason)+'</div>':'')+buttons+'</div>'+body()+ '<div class="card"><h2>Contract Version / History</h2><div id="history" class="history">Loading...</div></div>'}function body(){const c=contract,sch=Array.isArray(c.payment_schedule)?c.payment_schedule:[];return '<div class="card"><h2>1. दोनों पक्षों का विवरण</h2><div class="grid"><div class="field"><small>Customer</small><b>Project Customer</b></div><div class="field"><small>Contractor</small><b>BALAJI Construction Services</b></div><div class="field"><small>Site Address</small><b>'+esc(c.site_address||project.location||'—')+'</b></div><div class="field"><small>Contract Date</small><b>'+esc(c.contract_date||'—')+'</b></div></div></div><div class="card"><h2>2. कार्य का प्रकार एवं दायरा</h2><div class="grid"><div class="field"><small>Scope Type</small><b>'+esc(c.scope_type||project.work_type||'—')+'</b></div><div class="field"><small>Covered Area</small><b>'+esc(c.covered_area||'—')+'</b></div><div class="field"><small>Agreed Rate</small><b>'+esc(c.agreed_rate||'—')+'</b></div><div class="field"><small>Lump Sum</small><b>'+esc(c.lump_sum||c.amount||'—')+'</b></div></div><div class="field" style="margin-top:12px"><b>Extra Work: तय scope से अलग कार्य दोनों पक्षों की पूर्व सहमति से अलग से देय होगा।</b></div></div><div class="card"><h2>3. Payment Schedule</h2><table class="schedule"><thead><tr><th>Milestone</th><th>Payment %</th></tr></thead><tbody>'+sch.map(x=>'<tr><td>'+esc(x.milestone)+'</td><td>'+esc(x.percent)+'%</td></tr>').join('')+'</tbody></table></div><div class="card"><h2>4. समय एवं शर्तें</h2><div class="grid"><div class="field"><small>Start Date</small><b>'+esc(c.start_date||project.start_date||'—')+'</b></div><div class="field"><small>End Date</small><b>'+esc(c.end_date||project.expected_end_date||'—')+'</b></div></div><div class="field" style="margin-top:12px"><b>पानी एवं बिजली: निर्माण व curing हेतु आवश्यक व्यवस्था मालिक द्वारा उपलब्ध कराई जाएगी।</b></div><div class="field" style="margin-top:10px"><b>सामग्री: Labor Rate Only होने पर सीमेंट, बालू, गिट्टी, सरिया आदि समय पर उपलब्ध कराए जाएंगे।</b></div><div class="field" style="margin-top:10px"><b>सुरक्षा: कार्य स्थल पर कारीगरों एवं श्रमिकों की सुरक्षा की देखरेख ठेकेदार द्वारा की जाएगी।</b></div><div class="field" style="margin-top:10px"><b>दोष सुधार: कार्य पूरा होने के 6 माह तक तकनीकी खराबी होने पर ठेकेदार उसे दुरुस्त करेगा।</b></div></div><div class="card"><h2>5. Approval & Signatures</h2><div class="grid"><div class="field sign"><small>Customer Approval</small><b>'+(c.customer_approved_at?'✅ Approved — '+new Date(c.customer_approved_at).toLocaleString('en-IN'):'⏳ Pending')+'</b></div><div class="field sign"><small>Admin Approval</small><b>'+(c.admin_approved_at?'✅ Approved — '+new Date(c.admin_approved_at).toLocaleString('en-IN'):'⏳ Pending')+'</b></div></div></div>'}async function loadHistory(){const r=await sb.from('project_contract_versions').select('*').eq('contract_id',contract.id).order('created_at',{ascending:false});const h=$('history');if(!h)return;h.innerHTML=r.data?.length?r.data.map(v=>'<div class="historyItem"><b>Version '+esc(v.version)+'</b><div class="muted">'+new Date(v.created_at).toLocaleString('en-IN')+' • '+esc(v.reason||'')+'</div></div>').join(''):'<div class="muted">अभी अलग version history नहीं है।</div>'}async function propose(){const a=Number($('newAmount')?.value||0),reason=($('newReason')?.value||'').trim();if(!a||a<=0)return alert('Valid amount डालें।');const r=await sb.rpc('contract_propose_amount',{p_contract_id:contract.id,p_amount:a,p_reason:reason||null});if(r.error)return alert(r.error.message);await load()}async function amountDecision(ok){let reason=null;if(!ok){reason=promptReason('Amount reject/revision का कारण लिखें:');if(reason===null)return}const fn=isStaff?'contract_admin_amount_decision':'contract_customer_amount_decision';const r=await sb.rpc(fn,{p_contract_id:contract.id,p_approve:ok,p_reason:reason});if(r.error)return alert(r.error.message);await load()}async function contractDecision(ok){if(ok){const r=await sb.rpc('contract_customer_approve',{p_contract_id:contract.id});if(r.error)return alert(r.error.message)}else{const reason=promptReason('Contract revision का कारण लिखें:');if(reason===null)return;const r=await sb.rpc('contract_customer_reject',{p_contract_id:contract.id,p_reason:reason});if(r.error)return alert(r.error.message)}await load()}async function adminApprove(){const r=await sb.rpc('contract_admin_approve',{p_contract_id:contract.id});if(r.error)return alert(r.error.message);await load()}async function adminReject(){const reason=promptReason('Contract reject/revision का कारण लिखें:');if(reason===null)return;const r=await sb.rpc('contract_admin_reject',{p_contract_id:contract.id,p_reason:reason});if(r.error)return alert(r.error.message);await load()}async function newVersion(){const reason=promptReason('New Contract Version बनाने का कारण लिखें:');if(reason===null)return;const r=await sb.rpc('contract_create_new_version',{p_contract_id:contract.id,p_reason:reason});if(r.error)return alert(r.error.message);await load()}load();</script></body></html>
