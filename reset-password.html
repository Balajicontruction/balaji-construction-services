<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALAJI Construction | Set New Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:linear-gradient(135deg,#071b2e,#183f5d);min-height:100vh;display:grid;place-items:center;padding:20px;color:#172333}.card{width:min(480px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 30px 80px #0006}.logo{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#ffb34f,#f47718);display:grid;place-items:center;color:#fff;font-weight:900;font-size:23px}.tag{color:#f58220;font-weight:900;margin-top:15px}.muted{color:#687789;font-size:13px}label{display:block;font-weight:800;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #dce3ea;border-radius:11px}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin-top:16px;background:#f58220;color:#fff;font-weight:800;cursor:pointer}.notice{padding:12px;border-radius:12px;margin-top:14px;font-size:13px;background:#fff7ed}.success{background:#ecfdf5;color:#166534}.error{background:#fef2f2;color:#991b1b}</style></head><body><main class="card"><div class="logo">BC</div><div class="tag">BALAJI CONSTRUCTION SERVICES</div><h2>नया Password सेट करें</h2><p class="muted">नया password कम से कम 6 अक्षर का रखें।</p><label>नया Password</label><input id="p1" type="password" minlength="6" placeholder="New password"><label>Password दोबारा डालें</label><input id="p2" type="password" minlength="6" placeholder="Confirm password"><button class="btn" onclick="updatePassword()">Password Update करें</button><div id="msg" class="notice" style="display:none"></div></main><script>const sb=window.supabase.createClient('https://iefxfyjmyssuiuyncfqz.supabase.co','sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t');async function updatePassword(){const a=document.getElementById('p1').value,b=document.getElementById('p2').value,m=document.getElementById('msg');m.style.display='block';if(a.length<6){m.className='notice error';m.textContent='Password कम से कम 6 अक्षर का होना चाहिए।';return}if(a!==b){m.className='notice error';m.textContent='दोनों password समान नहीं हैं।';return}const{error}=await sb.auth.updateUser({password:a});if(error){m.className='notice error';m.textContent='Password update नहीं हुआ: '+error.message;return}m.className='notice success';m.textContent='Password सफलतापूर्वक बदल गया। अब Login Page पर जाकर login करें।';document.getElementById('p1').value='';document.getElementById('p2').value=''}</script></body></html>
