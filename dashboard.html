<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALAJI Construction • Admin Dashboard</title>
<script>
/* Daily update button injected without touching existing functions */
document.addEventListener('DOMContentLoaded',()=>{
  const addButton=()=>{
    const progressSection=document.querySelector('#progress .row');
    if(!progressSection||document.getElementById('dailyUpdateBtn')) return;
    const btn=document.createElement('button');
    btn.id='dailyUpdateBtn';
    btn.className='btn primary';
    btn.textContent='➕ Daily Update';
    btn.onclick=()=>location.href='admin-progress-updates.html';
    progressSection.appendChild(btn);
  };
  addButton();
  const observer=new MutationObserver(addButton);
  observer.observe(document.body,{childList:true,subtree:true});
});
</script>
</head>
<body>
<script>
/* Keep existing dashboard exactly as-is by loading it in place */
fetch('https://raw.githubusercontent.com/Balajicontruction/balaji-construction-services/main/dashboard.html')
  .then(r=>r.text())
  .then(html=>{
    const body=html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    document.body.innerHTML=body?body[1]:html;
  });
</script>
</body>
</html>
