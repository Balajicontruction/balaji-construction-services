<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALAJI Construction • Worker Attendance Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#0b1f33;--o:#f58220;--g:#16a34a;--bg:#f4f7fb;--l:#e4e9f0;--m:#6b7788;--t:#142235;--p:#7c3aed;--r:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,"Noto Sans Devanagari",sans-serif}.wrap{width:min(1100px,94%);margin:28px auto}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:20px;margin-bottom:16px}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--m);font-size:13px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--o);color:#fff}.approve{background:var(--g);color:#fff}.cancel{background:#fee2e2;color:#991b1b}.secondary{background:#eef2f7;color:var(--t)}.danger{background:#fee2e2;color:#991b1b}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:980px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}.table th{color:var(--m);font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;font-weight:800;font-size:11px}.present{background:#dcfce7;color:#166534}.pending{background:#f3e8ff;color:#6b21a8}.absent{background:#fee2e2;color:#991b1b}.neutral{background:#eef2f7;color:#475569}.notice{padding:13px;border-radius:12px;background:#fff7ed;margin-top:12px}.error{background:#fff1f2;color:#9f1239}.success{background:#ecfdf5;color:#166534}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f8fafc;border:1px solid var(--l);border-radius:15px;padding:14px}.big{font-size:25px;font-weight:900}.pendingbox{margin-top:14px;padding:14px;border:1px solid #e9d5ff;background:#faf5ff;border-radius:14px;color:#581c87;font-weight:800}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="card"><div class="top"><div><h1 style="margin:0">👷 Worker Attendance</h1><div class="muted">BALAJI Construction Admin Management</div></div><div class="row"><button class="btn secondary" onclick="location.href='dashboard.html'">← Dashboard</button><button class="btn primary" onclick="load()">↻ Refresh</button><button class="btn secondary" onclick="logout()">Logout</button></div></div></div><div id="loading" class="card">Admin session verify हो रही है...</div><div id="app" class="hidden"><div class="stats"><div class="stat"><div class="muted">Workers</div><div class="big" id="workers">0</div></div><div class="stat"><div class="muted">आज Present</div><div class="big" id="present">0</div></div><div class="stat"><div class="muted">Approval Pending</div><div class="big" id="pending">0</div></div><div class="stat"><div class="muted">आज Absent</div><div class="big" id="absent">0</div></div></div><div id="pendingNotice" class="pendingbox hidden"></div><div class="card"><div class="row"><div><h2 style="margin:0">आज की Attendance</h2><div class="muted">Worker face scan करने पर request पहले Pending रहेगी। Admin approve करने के बाद ही Present लगेगा। Cancel करने पर Absent लगेगा।</div></div><input id="date" type="date" onchange="load()" style="padding:10px;border:1px solid var(--l);border-radius:10px"></div><div id="list" class="tablewrap" style="margin-top:14px"></div></div></div></div><script>const sb=window.supabase.createClient('https://iefxfyjmyssuiuyncfqz.supabase.co','sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t');const q=id=>document.getElementById(id);let workers=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const {data:{session},error}=await sb.auth.getSession();if(error||!session)return location.replace('login.html');const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!p||!['admin','owner','manager','staff'].includes(String(p.role||'').toLowerCase()))return location.replace('login.html');q('loading').classList.add('hidden');q('app').classList.remove('hidden');q('date').value=new Date().toISOString().slice(0,10);await load()}async function load(){const date=q('date').value||new Date().toISOString().slice(0,10);const [wr,ar]=await Promise.all([sb.from('workers').select('id,name,phone,work_role,daily_rate').order('name'),sb.from('worker_attendance').select('id,worker_id,attendance_date,status,check_in,verification_method,verification_status,check_in_face_verified').eq('attendance_date',date).order('check_in',{ascending:false})]);if(wr.error||ar.error){q('list').innerHTML='<div class="notice error">'+esc((wr.error||ar.error).message)+'</div>';return}workers=wr.data||[];const a=ar.data||[];const present=a.filter(x=>x.status==='present').length;const pending=a.filter(x=>x.status==='pending').length;const absent=workers.length-present-pending;q('workers').textContent=workers.length;q('present').textContent=present;q('pending').textContent=pending;q('absent').textContent=Math.max(0,absent);const pendingRows=workers.map(w=>({w,x:a.find(x=>x.worker_id===w.id)})).filter(r=>r.x&&r.x.status==='pending');if(pendingRows.length){q('pendingNotice').classList.remove('hidden');q('pendingNotice').textContent='🔔 '+pendingRows.length+' Worker की attendance approval के लिए pending है। नीचे Approve / Cancel करें।'}else{q('pendingNotice').classList.add('hidden')}q('list').innerHTML='<table class="table"><thead><tr><th>Worker</th><th>Phone</th><th>Role</th><th>Status</th><th>Face / Check-in</th><th>Verification</th><th>Action</th></tr></thead><tbody>'+workers.map(w=>{const x=a.find(x=>x.worker_id===w.id);let status='<span class="pill neutral">Absent / Not Marked</span>';if(x?.status==='present')status='<span class="pill present">✅ Present</span>';else if(x?.status==='pending')status='<span class="pill pending">⏳ Approval Pending</span>';else if(x?.status==='absent')status='<span class="pill absent">❌ Absent</span>';const time=x?.check_in?new Date(x.check_in).toLocaleString('en-IN'):'—';let action='';if(x?.status==='pending'){action='<button class="btn approve" onclick="approve(\''+x.id+'\')">✅ Approve</button> <button class="btn cancel" onclick="cancelRequest(\''+x.id+'\')">❌ Cancel</button>'}else if(x){action='<button class="btn primary" onclick="mark(\''+w.id+'\',\'present\')">Present</button> <button class="btn danger" onclick="mark(\''+w.id+'\',\'absent\')">Absent</button> <button class="btn secondary" onclick="removeAttendance(\''+x.id+'\')">Delete</button>'}else{action='<button class="btn primary" onclick="mark(\''+w.id+'\',\'present\')">Present</button> <button class="btn danger" onclick="mark(\''+w.id+'\',\'absent\')">Absent</button>'}return '<tr><td><b>'+esc(w.name)+'</b></td><td>'+esc(w.phone)+'</td><td>'+esc(w.work_role)+'</td><td>'+status+'</td><td>'+time+(x?.check_in_face_verified?' <span class="pill present">Face ✓</span>':'')+'</td><td>'+esc(x?x.verification_status:'—')+'</td><td>'+action+'</td></tr>'}).join('')+'</tbody></table>'}async function approve(id){if(!confirm('इस Worker की face attendance को Present approve करें?'))return;const {error}=await sb.from('worker_attendance').update({status:'present',verification_status:'approved',verification_method:'face_recognition',updated_at:new Date().toISOString()}).eq('id',id).eq('status','pending');if(error)return alert(error.message);await load()}async function cancelRequest(id){if(!confirm('इस attendance request को Cancel करके Absent करना है?'))return;const {error}=await sb.from('worker_attendance').update({status:'absent',verification_status:'rejected',updated_at:new Date().toISOString()}).eq('id',id).eq('status','pending');if(error)return alert(error.message);await load()}async function mark(workerId,status){const date=q('date').value;const payload={worker_id:workerId,attendance_date:date,status,check_in:status==='present'?new Date().toISOString():null,verification_method:'admin',verification_status:'approved'};const {error}=await sb.from('worker_attendance').upsert(payload,{onConflict:'worker_id,attendance_date'});if(error)return alert(error.message);await load()}async function removeAttendance(id){if(!confirm('इस attendance record को delete करें?'))return;const {error}=await sb.from('worker_attendance').delete().eq('id',id);if(error)return alert(error.message);await load()}async function logout(){await sb.auth.signOut();location.replace('login.html')}init()</script></body></html>
