<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALAJI Construction | Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:linear-gradient(135deg,#071b2e,#183f5d);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#fff;border-radius:28px;padding:38px;box-shadow:0 30px 80px #0006}.brand{display:flex;gap:16px;align-items:center;margin-bottom:28px}.logo{width:62px;height:62px;border-radius:19px;background:linear-gradient(135deg,#ffb34f,#f47718);display:grid;place-items:center;color:#fff;font-weight:900;font-size:25px}.brand h1{margin:0;color:#0b1f33}.brand p{margin:3px 0;color:#687789}.tag{color:#f58220;font-weight:900}.h{font-size:34px;font-weight:900;color:#0b1f33;margin:8px 0}.muted{color:#687789}label{display:block;font-weight:800;margin:16px 0 7px;color:#172333}input{width:100%;padding:14px;border:1px solid #dce3eb;border-radius:12px;background:#eef4fd;font-size:16px}.btn{width:100%;margin-top:22px;border:0;border-radius:12px;padding:15px;background:#f58220;color:#fff;font-weight:900;font-size:17px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{margin-top:14px;padding:12px;border-radius:11px;display:none}.err{display:block;background:#fff1f2;color:#9f1239}.ok{display:block;background:#ecfdf5;color:#166534}a{display:block;text-align:center;margin-top:18px;color:#075985;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main class="card">
<div class="brand"><div class="logo">BC</div><div><h1>BALAJI Construction</h1><p>Private Admin / Staff Management</p></div></div>
<div class="tag">ADMIN / STAFF ACCESS</div><div class="h">Admin / Staff Login</div><p class="muted">Owner / Manager / Staff account से login करें।</p>
<form id="loginForm">
<label for="email">Email</label><input id="email" type="email" value="satpalswami22742@gmail.com" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" class="btn" type="submit">Login</button>
<div id="msg" class="msg"></div>
</form>
<a href="index.html">← Main Website</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://iefxfyjmyssuiuyncfqz.supabase.co','sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),msg=document.getElementById('msg');
function show(text,type='err'){msg.textContent=text;msg.className='msg '+type}
async function installFix(){
 try{if('serviceWorker' in navigator){await navigator.serviceWorker.register('admin-auth-fix-sw.js',{scope:'./'});await navigator.serviceWorker.ready;}}catch(e){console.warn('Auth bridge registration:',e)}
}
installFix();
form.addEventListener('submit',async e=>{
 e.preventDefault();msg.className='msg';msg.textContent='';btn.disabled=true;btn.textContent='Logging in...';
 try{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error) throw error;
  if(!data.session||!data.user) throw new Error('Login हुआ लेकिन session नहीं बनी। कृपया फिर Login करें।');
  await sb.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});
  show('Login सफल। Admin Dashboard खोला जा रहा है...','ok');
  setTimeout(()=>location.replace('dashboard.html?admin=1&v='+Date.now()),250);
 }catch(err){show(err?.message||String(err));btn.disabled=false;btn.textContent='Login'}
});
</script>
</body>
</html>
