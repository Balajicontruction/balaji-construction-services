<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BALAJI Construction | Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:linear-gradient(135deg,#071b2e,#183f5d)}
.card{width:min(480px,100%);background:#fff;border-radius:26px;padding:34px;box-shadow:0 30px 80px #0006}.logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#ffb34f,#f47718);display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px;margin-bottom:18px}.tag{color:#f58220;font-weight:900;letter-spacing:1px}.title{font-size:32px;font-weight:900;color:#0b1f33;margin:6px 0}.muted{color:#687789}label{display:block;font-weight:800;margin:18px 0 7px;color:#172333}input{width:100%;padding:14px;border:1px solid #d8dee7;border-radius:11px;font-size:16px;background:#f8fafc}.btn{width:100%;margin-top:22px;border:0;border-radius:12px;padding:14px;background:#f58220;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px}.err{display:block;background:#fff1f2;color:#9f1239}.ok{display:block;background:#ecfdf5;color:#166534}a{display:block;text-align:center;margin-top:18px;color:#075985;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main class="card">
<div class="logo">BC</div>
<div class="tag">PRIVATE MANAGEMENT</div>
<div class="title">Admin Login</div>
<p class="muted">यहाँ केवल पहले से बनाए गए Admin / Owner / Manager / Staff account से login करें।</p>
<form id="loginForm">
<label for="email">Admin Email</label>
<input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="अपना password डालें" required>
<button id="loginBtn" class="btn" type="submit">Login to Dashboard</button>
<div id="msg" class="msg"></div>
</form>
<a href="login.html">← वापस Login</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://iefxfyjmyssuiuyncfqz.supabase.co';
const SUPABASE_KEY='sb_publishable_45zaRM5LLByFABddU5hm9g_4UwfnT7t';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),msg=document.getElementById('msg');
function show(text,type='err'){msg.textContent=text;msg.className='msg '+type}
form.addEventListener('submit',async e=>{
 e.preventDefault();btn.disabled=true;btn.textContent='Login हो रहा है...';msg.className='msg';
 try{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error) throw error;
  if(!data.session||!data.user) throw new Error('Login हुआ लेकिन session नहीं बनी।');
  const {data:profile,error:pe}=await sb.from('profiles').select('role,full_name').eq('id',data.user.id).maybeSingle();
  if(pe) throw pe;
  const role=(profile?.role||'').toLowerCase();
  if(!['owner','manager','staff','admin'].includes(role)){
    await sb.auth.signOut();
    throw new Error('यह account Admin / Staff account नहीं है।');
  }
  show('Login सफल। Dashboard खोला जा रहा है...','ok');
  setTimeout(()=>window.location.replace('dashboard.html'),250);
 }catch(err){
  console.error(err);show(err?.message||'Login failed');btn.disabled=false;btn.textContent='Login to Dashboard';
 }
});
</script>
</body>
</html>
